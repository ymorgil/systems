<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">for · while · until: tres formas de repetir</text>

  <!-- for -->
  <g>
    <rect x="40" y="70" width="280" height="210" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="180" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#5e35b1">for</text>
    <text x="180" y="122" text-anchor="middle" font-size="11" fill="#37474f">Recorre una lista conocida</text>
    <rect x="65" y="135" width="230" height="26" rx="6" fill="#fff" stroke="#5e35b1"/>
    <text x="180" y="152" text-anchor="middle" font-size="10" fill="#37474f">for i in 1 2 3; do ... done</text>
    <circle cx="90" cy="200" r="6" fill="#5e35b1"/>
    <circle cx="180" cy="200" r="6" fill="#5e35b1"/>
    <circle cx="270" cy="200" r="6" fill="#5e35b1"/>
    <path d="M96 200 L174 200" stroke="#5e35b1" stroke-width="2" marker-end="url(#arrowb2)"/>
    <path d="M186 200 L264 200" stroke="#5e35b1" stroke-width="2" marker-end="url(#arrowb2)"/>
    <text x="90" y="222" text-anchor="middle" font-size="9" fill="#607d8b">it. 1</text>
    <text x="180" y="222" text-anchor="middle" font-size="9" fill="#607d8b">it. 2</text>
    <text x="270" y="222" text-anchor="middle" font-size="9" fill="#607d8b">it. 3</text>
    <text x="180" y="255" text-anchor="middle" font-size="10" fill="#607d8b">número de vueltas</text>
    <text x="180" y="268" text-anchor="middle" font-size="10" fill="#607d8b">fijo de antemano</text>
  </g>

  <!-- while -->
  <g>
    <rect x="360" y="70" width="280" height="210" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="500" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#00897b">while</text>
    <text x="500" y="122" text-anchor="middle" font-size="11" fill="#37474f">Repite mientras se cumpla</text>
    <rect x="385" y="135" width="230" height="26" rx="6" fill="#fff" stroke="#00897b"/>
    <text x="500" y="152" text-anchor="middle" font-size="10" fill="#37474f">while [ cond ]; do ... done</text>
    <rect x="440" y="180" width="120" height="30" rx="6" fill="#fff" stroke="#00897b"/>
    <text x="500" y="199" text-anchor="middle" font-size="10" fill="#37474f">¿cond = true?</text>
    <path d="M560 195 C 600 195, 600 230, 560 230" stroke="#00897b" stroke-width="2" fill="none" marker-end="url(#arrowb2)"/>
    <text x="605" y="216" font-size="9" fill="#37474f">sí</text>
    <text x="500" y="255" text-anchor="middle" font-size="10" fill="#607d8b">se comprueba la condición</text>
    <text x="500" y="268" text-anchor="middle" font-size="10" fill="#607d8b">antes de cada vuelta</text>
  </g>

  <!-- until -->
  <g>
    <rect x="680" y="70" width="280" height="210" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="820" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#5e35b1">until</text>
    <text x="820" y="122" text-anchor="middle" font-size="11" fill="#37474f">Repite hasta que se cumpla</text>
    <rect x="705" y="135" width="230" height="26" rx="6" fill="#fff" stroke="#5e35b1"/>
    <text x="820" y="152" text-anchor="middle" font-size="10" fill="#37474f">until [ cond ]; do ... done</text>
    <rect x="760" y="180" width="120" height="30" rx="6" fill="#fff" stroke="#5e35b1"/>
    <text x="820" y="199" text-anchor="middle" font-size="10" fill="#37474f">¿cond = false?</text>
    <path d="M880 195 C 920 195, 920 230, 880 230" stroke="#5e35b1" stroke-width="2" fill="none" marker-end="url(#arrowb2)"/>
    <text x="925" y="216" font-size="9" fill="#37474f">sí</text>
    <text x="820" y="255" text-anchor="middle" font-size="10" fill="#607d8b">es el inverso lógico</text>
    <text x="820" y="268" text-anchor="middle" font-size="10" fill="#607d8b">de while</text>
  </g>

  <text x="500" y="305" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">break sale del bucle · continue salta a la siguiente iteración</text>

  <defs>
    <marker id="arrowb2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#607d8b"/>
    </marker>
  </defs>
</svg>
