<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Tipos de estructuras de control en un script Bash</text>

  <!-- Secuencial -->
  <g>
    <rect x="30" y="70" width="210" height="210" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="135" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Secuencial</text>
    <rect x="55" y="115" width="160" height="26" rx="6" fill="#fff" stroke="#5e35b1"/>
    <text x="135" y="132" text-anchor="middle" font-size="10" fill="#37474f">línea 1</text>
    <path d="M135 141 L135 155" stroke="#5e35b1" stroke-width="2" marker-end="url(#arrowbash)"/>
    <rect x="55" y="157" width="160" height="26" rx="6" fill="#fff" stroke="#5e35b1"/>
    <text x="135" y="174" text-anchor="middle" font-size="10" fill="#37474f">línea 2</text>
    <path d="M135 183 L135 197" stroke="#5e35b1" stroke-width="2" marker-end="url(#arrowbash)"/>
    <rect x="55" y="199" width="160" height="26" rx="6" fill="#fff" stroke="#5e35b1"/>
    <text x="135" y="216" text-anchor="middle" font-size="10" fill="#37474f">línea 3</text>
    <text x="135" y="255" text-anchor="middle" font-size="10" fill="#607d8b">se ejecuta de arriba</text>
    <text x="135" y="268" text-anchor="middle" font-size="10" fill="#607d8b">a abajo, una vez</text>
  </g>

  <!-- Condicional -->
  <g>
    <rect x="270" y="70" width="220" height="210" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="380" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Condicional</text>
    <path d="M380 115 L410 140 L380 165 L350 140 Z" fill="#fff" stroke="#00897b" stroke-width="2"/>
    <text x="380" y="144" text-anchor="middle" font-size="9" fill="#37474f">if [ cond ]</text>
    <path d="M350 140 L305 140 L305 175" stroke="#00897b" stroke-width="2" marker-end="url(#arrowbash)"/>
    <text x="300" y="132" text-anchor="middle" font-size="9" fill="#37474f">falso</text>
    <rect x="280" y="177" width="70" height="24" rx="5" fill="#fff" stroke="#00897b"/>
    <text x="315" y="193" text-anchor="middle" font-size="9" fill="#37474f">else</text>
    <path d="M410 140 L455 140 L455 175" stroke="#00897b" stroke-width="2" marker-end="url(#arrowbash)"/>
    <text x="450" y="132" text-anchor="middle" font-size="9" fill="#37474f">true</text>
    <rect x="420" y="177" width="70" height="24" rx="5" fill="#fff" stroke="#00897b"/>
    <text x="455" y="193" text-anchor="middle" font-size="9" fill="#37474f">then</text>
    <text x="380" y="255" text-anchor="middle" font-size="10" fill="#607d8b">elige una sola rama</text>
    <text x="380" y="268" text-anchor="middle" font-size="10" fill="#607d8b">if / case</text>
  </g>

  <!-- Repetitiva -->
  <g>
    <rect x="510" y="70" width="220" height="210" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="620" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Repetitiva</text>
    <rect x="555" y="120" width="130" height="30" rx="6" fill="#fff" stroke="#5e35b1"/>
    <text x="620" y="139" text-anchor="middle" font-size="10" fill="#37474f">¿condición?</text>
    <path d="M685 135 C 715 135, 715 190, 685 190" stroke="#5e35b1" stroke-width="2" fill="none" marker-end="url(#arrowbash)"/>
    <rect x="555" y="176" width="130" height="30" rx="6" fill="#fff" stroke="#5e35b1"/>
    <text x="620" y="195" text-anchor="middle" font-size="10" fill="#37474f">cuerpo del bucle</text>
    <path d="M620 150 L620 176" stroke="#5e35b1" stroke-width="2" marker-end="url(#arrowbash)"/>
    <text x="620" y="255" text-anchor="middle" font-size="10" fill="#607d8b">repite mientras se</text>
    <text x="620" y="268" text-anchor="middle" font-size="10" fill="#607d8b">cumpla · for / while / until</text>
  </g>

  <!-- Funciones -->
  <g>
    <rect x="750" y="70" width="220" height="210" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="860" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Función</text>
    <rect x="775" y="118" width="170" height="30" rx="6" fill="#fff" stroke="#00897b"/>
    <text x="860" y="137" text-anchor="middle" font-size="10" fill="#37474f">llamada: mi_func "a"</text>
    <path d="M860 148 L860 168" stroke="#00897b" stroke-width="2" marker-end="url(#arrowbash)"/>
    <rect x="775" y="170" width="170" height="30" rx="6" fill="#fff" stroke="#00897b"/>
    <text x="860" y="189" text-anchor="middle" font-size="10" fill="#37474f">bloque reutilizable</text>
    <path d="M860 200 L860 220" stroke="#00897b" stroke-width="2" marker-end="url(#arrowbash)"/>
    <text x="860" y="235" text-anchor="middle" font-size="10" fill="#37474f">return / echo</text>
    <text x="860" y="260" text-anchor="middle" font-size="10" fill="#607d8b">encapsula código</text>
    <text x="860" y="273" text-anchor="middle" font-size="10" fill="#607d8b">y lo hace reutilizable</text>
  </g>

  <text x="500" y="308" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Todo script combina estos cuatro bloques básicos para resolver tareas de administración</text>

  <defs>
    <marker id="arrowbash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5e35b1"/>
    </marker>
  </defs>
</svg>
