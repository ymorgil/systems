<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Funciones en Bash: parámetros posicionales y retorno</text>

  <!-- Llamada -->
  <g>
    <rect x="40" y="80" width="260" height="130" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="170" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Llamada a la función</text>
    <rect x="60" y="120" width="220" height="30" rx="6" fill="#fff" stroke="#5e35b1"/>
    <text x="170" y="140" text-anchor="middle" font-size="11" fill="#37474f" font-family="monospace">crear_usuario "ana" "25"</text>
    <text x="170" y="170" text-anchor="middle" font-size="10" fill="#37474f">$1 = "ana"</text>
    <text x="170" y="188" text-anchor="middle" font-size="10" fill="#37474f">$2 = "25"   $@ = todos</text>
  </g>

  <path d="M300 145 L345 145" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrowb3)"/>

  <!-- Cuerpo -->
  <g>
    <rect x="350" y="70" width="300" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="500" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">Cuerpo de la función</text>
    <rect x="370" y="110" width="260" height="90" rx="6" fill="#263238"/>
    <text x="385" y="130" font-size="10" fill="#a5d6a7" font-family="monospace">crear_usuario() {</text>
    <text x="395" y="146" font-size="10" fill="#eceff1" font-family="monospace">local nombre=$1</text>
    <text x="395" y="162" font-size="10" fill="#eceff1" font-family="monospace">local edad=$2</text>
    <text x="385" y="178" font-size="10" fill="#a5d6a7" font-family="monospace">}</text>
    <text x="500" y="235" text-anchor="middle" font-size="10" fill="#607d8b">local evita contaminar</text>
    <text x="500" y="248" text-anchor="middle" font-size="10" fill="#607d8b">el resto del script</text>
  </g>

  <path d="M660 145 L705 145" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrowb3)"/>

  <!-- Salida -->
  <g>
    <rect x="710" y="80" width="250" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="835" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Dos formas de "devolver"</text>
    <rect x="730" y="118" width="210" height="40" rx="6" fill="#fff" stroke="#5e35b1"/>
    <text x="835" y="134" text-anchor="middle" font-size="10" fill="#37474f" font-family="monospace">return 0/1 (código salida)</text>
    <text x="835" y="150" text-anchor="middle" font-size="9" fill="#607d8b">se lee con $?</text>
    <rect x="730" y="165" width="210" height="40" rx="6" fill="#fff" stroke="#5e35b1"/>
    <text x="835" y="181" text-anchor="middle" font-size="10" fill="#37474f" font-family="monospace">echo "valor"</text>
    <text x="835" y="197" text-anchor="middle" font-size="9" fill="#607d8b">se captura con $(func)</text>
  </g>

  <text x="500" y="270" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">return solo puede devolver un código numérico (0-255): para datos, se usa echo + captura</text>

  <defs>
    <marker id="arrowb3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
