<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Ramas en Git: crear, trabajar y fusionar (merge)</text>

  <!-- main line -->
  <line x1="80" y1="150" x2="920" y2="150" stroke="#5e35b1" stroke-width="4"/>
  <circle cx="140" cy="150" r="9" fill="#5e35b1"/>
  <circle cx="300" cy="150" r="9" fill="#5e35b1"/>
  <circle cx="820" cy="150" r="9" fill="#5e35b1"/>
  <text x="140" y="130" text-anchor="middle" font-size="11" fill="#37474f">commit inicial</text>
  <text x="300" y="130" text-anchor="middle" font-size="11" fill="#37474f">git branch feature</text>
  <text x="820" y="130" text-anchor="middle" font-size="11" fill="#37474f">git merge feature</text>
  <text x="80" y="185" font-size="13" font-weight="700" fill="#5e35b1">main</text>

  <!-- feature branch -->
  <path d="M300 150 C 420 150, 420 240, 460 240" stroke="#00897b" stroke-width="4" fill="none"/>
  <circle cx="500" cy="240" r="9" fill="#00897b"/>
  <circle cx="620" cy="240" r="9" fill="#00897b"/>
  <path d="M700 240 C 740 240, 740 150, 820 150" stroke="#00897b" stroke-width="4" fill="none"/>
  <circle cx="700" cy="240" r="9" fill="#00897b"/>
  <text x="500" y="265" text-anchor="middle" font-size="11" fill="#37474f">commit A</text>
  <text x="620" y="265" text-anchor="middle" font-size="11" fill="#37474f">commit B</text>
  <text x="700" y="222" text-anchor="middle" font-size="11" fill="#37474f">commit C</text>
  <text x="465" y="290" font-size="13" font-weight="700" fill="#00897b">feature</text>

  <text x="500" y="40" text-anchor="middle" font-size="1" fill="transparent"> </text>
  <text x="500" y="295" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">git switch -c feature · git checkout main · git merge feature</text>
</svg>
