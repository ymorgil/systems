<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Anatomía de la ventana de Visual Studio Code</text>

  <!-- Activity bar -->
  <rect x="30" y="50" width="46" height="230" rx="8" fill="#37474f"/>
  <text x="53" y="45" text-anchor="middle" font-size="10" fill="#607d8b">Activity</text>
  <circle cx="53" cy="80" r="9" fill="#ede7f6"/>
  <circle cx="53" cy="115" r="9" fill="#ede7f6"/>
  <circle cx="53" cy="150" r="9" fill="#ede7f6"/>
  <circle cx="53" cy="185" r="9" fill="#ede7f6"/>
  <circle cx="53" cy="220" r="9" fill="#ede7f6"/>

  <!-- Sidebar -->
  <rect x="80" y="50" width="170" height="230" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="165" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Explorador</text>
  <text x="95" y="95" font-size="10" fill="#37474f">📁 docs</text>
  <text x="105" y="112" font-size="10" fill="#37474f">📁 05scripting</text>
  <text x="115" y="129" font-size="10" fill="#37474f">📄 04vscode-git.md</text>
  <text x="115" y="146" font-size="10" fill="#37474f">📄 05bash-...md</text>
  <text x="95" y="168" font-size="10" fill="#37474f">📁 assets</text>
  <text x="95" y="190" font-size="10" fill="#37474f">📄 mkdocs.yml</text>

  <!-- Editor -->
  <rect x="256" y="50" width="460" height="180" rx="8" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
  <rect x="256" y="50" width="460" height="26" rx="8" fill="#e0f2f1"/>
  <text x="270" y="68" font-size="11" fill="#00897b" font-weight="700">04vscode-git.md</text>
  <text x="272" y="100" font-size="10" fill="#37474f"># Título del documento</text>
  <text x="272" y="120" font-size="10" fill="#37474f">## Sección primera</text>
  <text x="272" y="140" font-size="10" fill="#607d8b">Texto de ejemplo del editor...</text>
  <text x="272" y="160" font-size="10" fill="#5e35b1">```bash</text>
  <text x="272" y="178" font-size="10" fill="#37474f">git status</text>
  <text x="272" y="196" font-size="10" fill="#5e35b1">```</text>

  <!-- Integrated terminal -->
  <rect x="256" y="236" width="460" height="60" rx="8" fill="#263238"/>
  <text x="270" y="256" font-size="11" fill="#80cbc4" font-weight="700">TERMINAL</text>
  <text x="270" y="276" font-size="10" fill="#a5d6a7">$ git status</text>
  <text x="270" y="290" font-size="10" fill="#eceff1">On branch main, nothing to commit</text>

  <!-- Right panel: extensions -->
  <rect x="726" y="50" width="230" height="246" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="841" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">Extensiones</text>
  <text x="740" y="95" font-size="10" fill="#37474f">🧩 GitLens</text>
  <text x="740" y="115" font-size="10" fill="#37474f">🧩 Remote - SSH</text>
  <text x="740" y="135" font-size="10" fill="#37474f">🧩 Python</text>
  <text x="740" y="155" font-size="10" fill="#37474f">🧩 PowerShell</text>
  <text x="740" y="175" font-size="10" fill="#37474f">🧩 Docker</text>
  <text x="740" y="195" font-size="10" fill="#37474f">🧩 Markdown All in One</text>
  <text x="740" y="215" font-size="10" fill="#37474f">🧩 YAML</text>
  <text x="740" y="235" font-size="10" fill="#37474f">🧩 Material Icon Theme</text>

  <text x="500" y="312" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Barra de actividad · Explorador · Editor · Terminal integrada · Extensiones</text>
