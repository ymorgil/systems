<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Arquitectura agentless de Ansible</text>

  <!-- Nodo de control -->
  <g>
    <rect x="30" y="90" width="200" height="170" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="130" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Nodo de control</text>
    <text x="130" y="145" text-anchor="middle" font-size="11" fill="#37474f">ansible-playbook</text>
    <text x="130" y="165" text-anchor="middle" font-size="11" fill="#37474f">Módulos Python</text>
    <text x="130" y="185" text-anchor="middle" font-size="11" fill="#37474f">Plugins</text>
    <text x="130" y="205" text-anchor="middle" font-size="11" fill="#37474f">Sin agente residente</text>
    <text x="130" y="225" text-anchor="middle" font-size="11" fill="#37474f">en los hosts remotos</text>
  </g>

  <path d="M230 175 L275 175" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Inventario -->
  <g>
    <rect x="280" y="90" width="170" height="170" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="365" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Inventario</text>
    <text x="365" y="145" text-anchor="middle" font-size="11" fill="#37474f">inventory.ini / .yml</text>
    <text x="365" y="165" text-anchor="middle" font-size="11" fill="#37474f">Grupos de hosts</text>
    <text x="365" y="185" text-anchor="middle" font-size="11" fill="#37474f">Variables por host</text>
    <text x="365" y="205" text-anchor="middle" font-size="11" fill="#37474f">Inventario dinámico</text>
    <text x="365" y="225" text-anchor="middle" font-size="11" fill="#37474f">(cloud, CMDB...)</text>
  </g>

  <path d="M450 175 L495 175" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Playbook / Tasks -->
  <g>
    <rect x="500" y="90" width="170" height="170" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="585" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Playbook</text>
    <text x="585" y="145" text-anchor="middle" font-size="11" fill="#37474f">Tasks (YAML)</text>
    <text x="585" y="165" text-anchor="middle" font-size="11" fill="#37474f">Handlers</text>
    <text x="585" y="185" text-anchor="middle" font-size="11" fill="#37474f">Roles</text>
    <text x="585" y="205" text-anchor="middle" font-size="11" fill="#37474f">Plantillas Jinja2</text>
    <text x="585" y="225" text-anchor="middle" font-size="11" fill="#37474f">Idempotencia</text>
  </g>

  <path d="M670 175 L715 175" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="693" y="160" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">SSH</text>

  <!-- Hosts gestionados -->
  <g>
    <rect x="720" y="80" width="250" height="190" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="845" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Hosts gestionados</text>

    <rect x="740" y="120" width="90" height="55" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="785" y="145" text-anchor="middle" font-size="10" fill="#37474f">web01</text>
    <text x="785" y="160" text-anchor="middle" font-size="9" fill="#607d8b">Python + SSH</text>

    <rect x="840" y="120" width="90" height="55" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="885" y="145" text-anchor="middle" font-size="10" fill="#37474f">web02</text>
    <text x="885" y="160" text-anchor="middle" font-size="9" fill="#607d8b">Python + SSH</text>

    <rect x="740" y="185" width="90" height="55" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="785" y="210" text-anchor="middle" font-size="10" fill="#37474f">db01</text>
    <text x="785" y="225" text-anchor="middle" font-size="9" fill="#607d8b">Python + SSH</text>

    <rect x="840" y="185" width="90" height="55" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="885" y="210" text-anchor="middle" font-size="10" fill="#37474f">lb01</text>
    <text x="885" y="225" text-anchor="middle" font-size="9" fill="#607d8b">Python + SSH</text>
  </g>

  <text x="500" y="295" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">El control envía módulos Python por SSH; no hay agente permanente instalado en los hosts</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
