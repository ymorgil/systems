<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="300" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Un índice de Elasticsearch: shards y réplicas</text>

  <g>
    <rect x="60" y="80" width="880" height="170" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="500" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">Índice: logs-app-2026.07.11</text>
  </g>

  <!-- Primary shards -->
  <rect x="90" y="120" width="150" height="55" rx="10" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="165" y="142" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">Shard primario 0</text>
  <text x="165" y="158" text-anchor="middle" font-size="9" fill="#607d8b">nodo A</text>

  <rect x="260" y="120" width="150" height="55" rx="10" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="335" y="142" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">Shard primario 1</text>
  <text x="335" y="158" text-anchor="middle" font-size="9" fill="#607d8b">nodo B</text>

  <rect x="430" y="120" width="150" height="55" rx="10" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="505" y="142" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">Shard primario 2</text>
  <text x="505" y="158" text-anchor="middle" font-size="9" fill="#607d8b">nodo C</text>

  <!-- Replicas -->
  <rect x="90" y="190" width="150" height="55" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="165" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#8e24aa">Réplica 0</text>
  <text x="165" y="228" text-anchor="middle" font-size="9" fill="#607d8b">nodo C</text>

  <rect x="260" y="190" width="150" height="55" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="335" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#8e24aa">Réplica 1</text>
  <text x="335" y="228" text-anchor="middle" font-size="9" fill="#607d8b">nodo A</text>

  <rect x="430" y="190" width="150" height="55" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="505" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#8e24aa">Réplica 2</text>
  <text x="505" y="228" text-anchor="middle" font-size="9" fill="#607d8b">nodo B</text>

  <text x="770" y="150" text-anchor="middle" font-size="11" fill="#37474f">Los primarios reparten</text>
  <text x="770" y="168" text-anchor="middle" font-size="11" fill="#37474f">la escritura entre nodos</text>
  <text x="770" y="200" text-anchor="middle" font-size="11" fill="#37474f">Las réplicas dan tolerancia</text>
  <text x="770" y="218" text-anchor="middle" font-size="11" fill="#37474f">a fallos y reparten lecturas</text>

  <text x="500" y="275" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Un ILM policy rota, reduce y borra estos índices automáticamente con el tiempo</text>
</svg>
