<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Arquitectura de Nagios Core: núcleo, plugins y NRPE</text>

  <!-- Nagios core -->
  <g>
    <rect x="30" y="90" width="230" height="180" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="145" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Nagios Core</text>
    <text x="145" y="140" text-anchor="middle" font-size="11" fill="#37474f">Planificador de checks</text>
    <text x="145" y="160" text-anchor="middle" font-size="11" fill="#37474f">Máquina de estados</text>
    <text x="145" y="180" text-anchor="middle" font-size="11" fill="#37474f">(OK/WARNING/CRITICAL)</text>
    <text x="145" y="200" text-anchor="middle" font-size="11" fill="#37474f">Notificaciones</text>
    <text x="145" y="220" text-anchor="middle" font-size="11" fill="#37474f">Ficheros .cfg</text>
  </g>

  <path d="M260 140 L305 115" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M260 200 L305 225" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Plugins locales -->
  <g>
    <rect x="310" y="75" width="190" height="80" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="405" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">Plugins locales</text>
    <text x="405" y="120" text-anchor="middle" font-size="10" fill="#37474f">check_ping, check_http,</text>
    <text x="405" y="138" text-anchor="middle" font-size="10" fill="#37474f">check_disk, check_load</text>
  </g>

  <!-- NRPE -->
  <g>
    <rect x="310" y="190" width="190" height="80" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="405" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#ef6c00">NRPE</text>
    <text x="405" y="235" text-anchor="middle" font-size="10" fill="#37474f">Ejecuta plugins</text>
    <text x="405" y="253" text-anchor="middle" font-size="10" fill="#37474f">en el host remoto</text>
  </g>

  <path d="M500 230 L545 230" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="522" y="218" text-anchor="middle" font-size="9" fill="#607d8b">TCP 5666</text>

  <!-- Remote host -->
  <g>
    <rect x="550" y="190" width="180" height="80" rx="14" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
    <text x="640" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#ad1457">Host remoto</text>
    <text x="640" y="235" text-anchor="middle" font-size="10" fill="#37474f">nrpe daemon +</text>
    <text x="640" y="253" text-anchor="middle" font-size="10" fill="#37474f">plugins locales</text>
  </g>

  <path d="M500 115 L545 115" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect x="550" y="75" width="180" height="80" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="640" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#1565c0">Red / Internet</text>
    <text x="640" y="120" text-anchor="middle" font-size="10" fill="#37474f">ping, http, puertos</text>
    <text x="640" y="138" text-anchor="middle" font-size="10" fill="#37474f">comprobados desde fuera</text>
  </g>

  <!-- Web interface -->
  <g>
    <rect x="770" y="130" width="190" height="80" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="865" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#f57f17">Nagios Web UI</text>
    <text x="865" y="175" text-anchor="middle" font-size="10" fill="#37474f">CGI / Tactical</text>
    <text x="865" y="193" text-anchor="middle" font-size="10" fill="#37474f">Overview</text>
  </g>
  <path d="M260 180 L860 180 L860 210" stroke="#90a4ae" stroke-width="2" stroke-dasharray="4,3" fill="none"/>

  <text x="500" y="298" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Nagios Core solo decide OK/WARNING/CRITICAL; la lógica real vive en cada plugin</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
