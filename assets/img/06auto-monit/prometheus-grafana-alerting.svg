<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="300" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Flujo de una alerta: de la regla PromQL a la notificación</text>

  <g>
    <rect x="30" y="90" width="190" height="140" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="125" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Regla de alerta</text>
    <text x="125" y="142" text-anchor="middle" font-size="10" fill="#37474f">expr: PromQL</text>
    <text x="125" y="160" text-anchor="middle" font-size="10" fill="#37474f">for: 5m</text>
    <text x="125" y="178" text-anchor="middle" font-size="10" fill="#37474f">labels / annotations</text>
  </g>

  <path d="M220 160 L260 160" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="265" y="90" width="190" height="140" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="360" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#ef6c00">Estado</text>
    <text x="360" y="145" text-anchor="middle" font-size="10" fill="#37474f">inactive → pending</text>
    <text x="360" y="163" text-anchor="middle" font-size="10" fill="#37474f">→ firing</text>
    <text x="360" y="185" text-anchor="middle" font-size="9" fill="#607d8b">(según se cumpla "for")</text>
  </g>

  <path d="M455 160 L495 160" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="500" y="90" width="190" height="140" rx="14" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
    <text x="595" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#ad1457">Alertmanager</text>
    <text x="595" y="142" text-anchor="middle" font-size="10" fill="#37474f">Agrupa por labels</text>
    <text x="595" y="160" text-anchor="middle" font-size="10" fill="#37474f">Aplica silences</text>
    <text x="595" y="178" text-anchor="middle" font-size="10" fill="#37474f">Enruta por "route"</text>
  </g>

  <path d="M690 130 L730 105" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M690 190 L730 215" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="735" y="65" width="220" height="60" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="845" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#f57f17">Equipo de guardia</text>
    <text x="845" y="108" text-anchor="middle" font-size="10" fill="#37474f">PagerDuty / Slack</text>
  </g>

  <g>
    <rect x="735" y="175" width="220" height="60" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="845" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#1565c0">Panel en Grafana</text>
    <text x="845" y="218" text-anchor="middle" font-size="10" fill="#37474f">Estado visual firing/ok</text>
  </g>

  <text x="500" y="270" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Prometheus evalúa la condición; Alertmanager decide a quién y cuándo avisar</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
