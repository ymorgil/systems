<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="340" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Arquitectura de Prometheus y Grafana</text>

  <!-- Targets / exporters -->
  <g>
    <rect x="30" y="90" width="190" height="170" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="125" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">Targets</text>
    <rect x="45" y="128" width="160" height="30" rx="6" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/>
    <text x="125" y="148" text-anchor="middle" font-size="10" fill="#37474f">node_exporter :9100</text>
    <rect x="45" y="165" width="160" height="30" rx="6" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/>
    <text x="125" y="185" text-anchor="middle" font-size="10" fill="#37474f">cAdvisor :8080</text>
    <rect x="45" y="202" width="160" height="30" rx="6" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/>
    <text x="125" y="222" text-anchor="middle" font-size="10" fill="#37474f">app /metrics</text>
  </g>

  <path d="M220 175 L265 175" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="242" y="163" text-anchor="middle" font-size="9" fill="#607d8b" font-style="italic">scrape (pull)</text>

  <!-- Prometheus server -->
  <g>
    <rect x="270" y="80" width="220" height="190" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="380" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Prometheus Server</text>
    <text x="380" y="130" text-anchor="middle" font-size="11" fill="#37474f">Scrape scheduler</text>
    <text x="380" y="150" text-anchor="middle" font-size="11" fill="#37474f">Service discovery</text>
    <text x="380" y="170" text-anchor="middle" font-size="11" fill="#37474f">TSDB (series temporales)</text>
    <text x="380" y="190" text-anchor="middle" font-size="11" fill="#37474f">Motor PromQL</text>
    <text x="380" y="210" text-anchor="middle" font-size="11" fill="#37474f">Evaluador de reglas</text>
    <text x="380" y="230" text-anchor="middle" font-size="11" fill="#37474f">de alerta</text>
  </g>

  <path d="M490 130 L535 105" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M490 220 L535 245" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Alertmanager -->
  <g>
    <rect x="540" y="60" width="190" height="90" rx="14" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
    <text x="635" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#ad1457">Alertmanager</text>
    <text x="635" y="108" text-anchor="middle" font-size="10" fill="#37474f">Agrupa, silencia y</text>
    <text x="635" y="124" text-anchor="middle" font-size="10" fill="#37474f">enruta alertas</text>
  </g>

  <path d="M730 105 L775 105" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect x="780" y="60" width="190" height="90" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="875" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#f57f17">Slack / Email /</text>
    <text x="875" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#f57f17">Webhook / PagerDuty</text>
  </g>

  <!-- Grafana -->
  <g>
    <rect x="540" y="180" width="420" height="90" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="750" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">Grafana</text>
    <text x="750" y="228" text-anchor="middle" font-size="10" fill="#37474f">Consulta PromQL vía datasource · dashboards, paneles, alertas visuales</text>
    <text x="750" y="246" text-anchor="middle" font-size="10" fill="#37474f">y variables reutilizables entre paneles</text>
  </g>

  <text x="500" y="310" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Prometheus recolecta y almacena; Alertmanager notifica; Grafana visualiza</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
