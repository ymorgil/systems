<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="300" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Estado remoto de Terraform y trabajo en equipo</text>

  <g>
    <rect x="40" y="80" width="180" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="130" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Ingeniero A</text>
    <text x="130" y="140" text-anchor="middle" font-size="11" fill="#37474f">main.tf</text>
    <text x="130" y="160" text-anchor="middle" font-size="11" fill="#37474f">terraform plan</text>
    <text x="130" y="180" text-anchor="middle" font-size="11" fill="#37474f">terraform apply</text>
  </g>

  <g>
    <rect x="40" y="250" width="0" height="0"/>
  </g>

  <g>
    <rect x="780" y="80" width="180" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="870" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Ingeniero B</text>
    <text x="870" y="140" text-anchor="middle" font-size="11" fill="#37474f">main.tf</text>
    <text x="870" y="160" text-anchor="middle" font-size="11" fill="#37474f">terraform plan</text>
    <text x="870" y="180" text-anchor="middle" font-size="11" fill="#37474f">terraform apply</text>
  </g>

  <path d="M220 155 L370 130" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M780 155 L630 130" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Backend remoto -->
  <g>
    <rect x="375" y="70" width="250" height="120" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="500" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Backend remoto</text>
    <text x="500" y="125" text-anchor="middle" font-size="11" fill="#37474f">S3 + DynamoDB / Terraform</text>
    <text x="500" y="143" text-anchor="middle" font-size="11" fill="#37474f">Cloud / Azure Blob</text>
    <text x="500" y="163" text-anchor="middle" font-size="11" fill="#37474f">Lock del .tfstate</text>
  </g>

  <path d="M500 190 L500 220" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="380" y="225" width="240" height="55" rx="10" fill="#37474f"/>
    <text x="500" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Infraestructura real (cloud)</text>
  </g>

  <text x="500" y="290" text-anchor="middle" font-size="11" fill="#607d8b" font-style="italic">El backend remoto evita conflictos: solo un apply a la vez y el estado no vive en un portátil</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
