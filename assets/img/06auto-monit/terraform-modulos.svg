<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Módulos reutilizables en Terraform</text>

  <g>
    <rect x="40" y="80" width="220" height="180" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="150" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Root module</text>
    <text x="150" y="135" text-anchor="middle" font-size="11" fill="#37474f">main.tf</text>
    <text x="150" y="155" text-anchor="middle" font-size="11" fill="#37474f">variables.tf</text>
    <text x="150" y="175" text-anchor="middle" font-size="11" fill="#37474f">outputs.tf</text>
    <text x="150" y="195" text-anchor="middle" font-size="11" fill="#37474f">terraform.tfvars</text>
    <text x="150" y="220" text-anchor="middle" font-size="10" fill="#607d8b">Llama a módulos hijos</text>
  </g>

  <path d="M260 130 L305 100" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M260 170 L305 170" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M260 210 L305 240" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="310" y="60" width="190" height="90" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="405" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">module "red"</text>
    <text x="405" y="110" text-anchor="middle" font-size="10" fill="#37474f">VPC, subredes,</text>
    <text x="405" y="128" text-anchor="middle" font-size="10" fill="#37474f">tablas de rutas</text>
  </g>

  <g>
    <rect x="310" y="130" width="190" height="80" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="405" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">module "compute"</text>
    <text x="405" y="180" text-anchor="middle" font-size="10" fill="#37474f">Instancias / VMs</text>
  </g>

  <g>
    <rect x="310" y="220" width="190" height="80" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="405" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">module "db"</text>
    <text x="405" y="270" text-anchor="middle" font-size="10" fill="#37474f">Base de datos gestionada</text>
  </g>

  <path d="M500 160 L545 160" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="550" y="90" width="200" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="650" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Providers</text>
    <text x="650" y="148" text-anchor="middle" font-size="11" fill="#37474f">AWS</text>
    <text x="650" y="168" text-anchor="middle" font-size="11" fill="#37474f">Azure</text>
    <text x="650" y="188" text-anchor="middle" font-size="11" fill="#37474f">GCP</text>
    <text x="650" y="208" text-anchor="middle" font-size="11" fill="#37474f">Proxmox</text>
  </g>

  <path d="M750 165 L795 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="800" y="110" width="160" height="110" rx="14" fill="#37474f"/>
    <text x="880" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Infraestructura</text>
    <text x="880" y="165" text-anchor="middle" font-size="11" fill="#ffffff">real desplegada</text>
    <text x="880" y="185" text-anchor="middle" font-size="11" fill="#ffffff">(cloud / on-premise)</text>
  </g>

  <text x="500" y="295" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Un módulo se versiona y reutiliza entre proyectos, igual que un rol de Ansible</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
