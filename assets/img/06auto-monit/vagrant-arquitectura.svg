<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Arquitectura de Vagrant: de un archivo de texto a una VM funcionando</text>

  <g>
    <rect x="40" y="90" width="200" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="140" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Vagrantfile</text>
    <text x="140" y="148" text-anchor="middle" font-size="11" fill="#37474f">Ruby declarativo</text>
    <text x="140" y="168" text-anchor="middle" font-size="11" fill="#37474f">Box base</text>
    <text x="140" y="188" text-anchor="middle" font-size="11" fill="#37474f">Redes y puertos</text>
    <text x="140" y="208" text-anchor="middle" font-size="11" fill="#37474f">Provisioners</text>
  </g>

  <path d="M240 165 L285 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="290" y="90" width="180" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="380" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Vagrant core</text>
    <text x="380" y="148" text-anchor="middle" font-size="11" fill="#37474f">Motor de órdenes</text>
    <text x="380" y="168" text-anchor="middle" font-size="11" fill="#37474f">Gestión de boxes</text>
    <text x="380" y="188" text-anchor="middle" font-size="11" fill="#37474f">Sincronización de</text>
    <text x="380" y="206" text-anchor="middle" font-size="11" fill="#37474f">carpetas</text>
  </g>

  <path d="M470 165 L515 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="520" y="80" width="200" height="170" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="620" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Provider</text>
    <text x="620" y="135" text-anchor="middle" font-size="11" fill="#37474f">VirtualBox</text>
    <text x="620" y="155" text-anchor="middle" font-size="11" fill="#37474f">VMware</text>
    <text x="620" y="175" text-anchor="middle" font-size="11" fill="#37474f">libvirt / KVM</text>
    <text x="620" y="195" text-anchor="middle" font-size="11" fill="#37474f">Docker</text>
    <text x="620" y="215" text-anchor="middle" font-size="11" fill="#37474f">(hipervisor real)</text>
  </g>

  <path d="M720 165 L765 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="770" y="90" width="190" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="865" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Máquina virtual</text>
    <text x="865" y="148" text-anchor="middle" font-size="11" fill="#37474f">SO del box</text>
    <text x="865" y="168" text-anchor="middle" font-size="11" fill="#37474f">Provisionada con</text>
    <text x="865" y="186" text-anchor="middle" font-size="11" fill="#37474f">Shell / Ansible</text>
    <text x="865" y="206" text-anchor="middle" font-size="11" fill="#37474f">Accesible por SSH</text>
  </g>

  <text x="500" y="280" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">El Vagrantfile es la única fuente de verdad: cualquiera puede reproducir el mismo entorno con "vagrant up"</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
