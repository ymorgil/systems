<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="340" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Ciclo de vida de una máquina Vagrant</text>

  <!-- init -->
  <g>
    <rect x="30" y="100" width="150" height="130" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="105" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">vagrant init</text>
    <text x="105" y="160" text-anchor="middle" font-size="11" fill="#37474f">Genera el</text>
    <text x="105" y="178" text-anchor="middle" font-size="11" fill="#37474f">Vagrantfile</text>
    <text x="105" y="200" text-anchor="middle" font-size="11" fill="#37474f">a partir de un box</text>
  </g>

  <path d="M180 165 L220 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- up -->
  <g>
    <rect x="225" y="100" width="150" height="130" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="300" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">vagrant up</text>
    <text x="300" y="160" text-anchor="middle" font-size="11" fill="#37474f">Descarga el box,</text>
    <text x="300" y="178" text-anchor="middle" font-size="11" fill="#37474f">crea la VM y</text>
    <text x="300" y="196" text-anchor="middle" font-size="11" fill="#37474f">la aprovisiona</text>
  </g>

  <path d="M375 165 L415 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- running / ssh -->
  <g>
    <rect x="420" y="90" width="170" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="505" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Running</text>
    <text x="505" y="145" text-anchor="middle" font-size="11" fill="#37474f">vagrant ssh</text>
    <text x="505" y="165" text-anchor="middle" font-size="11" fill="#37474f">vagrant provision</text>
    <text x="505" y="185" text-anchor="middle" font-size="11" fill="#37474f">vagrant reload</text>
    <text x="505" y="205" text-anchor="middle" font-size="11" fill="#37474f">vagrant status</text>
  </g>

  <path d="M590 145 L630 120" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M590 195 L630 220" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- halt -->
  <g>
    <rect x="635" y="70" width="150" height="100" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="710" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">vagrant halt</text>
    <text x="710" y="130" text-anchor="middle" font-size="11" fill="#37474f">Apaga la VM,</text>
    <text x="710" y="148" text-anchor="middle" font-size="11" fill="#37474f">conserva el disco</text>
  </g>

  <!-- destroy -->
  <g>
    <rect x="635" y="190" width="150" height="100" rx="14" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
    <text x="710" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#ad1457">vagrant destroy</text>
    <text x="710" y="247" text-anchor="middle" font-size="11" fill="#37474f">Elimina la VM</text>
    <text x="710" y="265" text-anchor="middle" font-size="11" fill="#37474f">y sus discos</text>
  </g>

  <path d="M710 170 L710 190" stroke="#90a4ae" stroke-width="2" stroke-dasharray="4,3"/>

  <path d="M785 120 L850 120" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="815" y="108" text-anchor="middle" font-size="10" fill="#607d8b">vagrant up</text>

  <g>
    <rect x="855" y="70" width="120" height="100" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="915" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Detenida</text>
    <text x="915" y="128" text-anchor="middle" font-size="10" fill="#37474f">Reanudable</text>
    <text x="915" y="146" text-anchor="middle" font-size="10" fill="#37474f">con vagrant up</text>
  </g>

  <text x="500" y="310" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">init crea el Vagrantfile una vez; up / halt / destroy gestionan el ciclo de vida repetible de la VM</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
