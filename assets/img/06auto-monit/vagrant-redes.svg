<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Modos de red en Vagrant</text>

  <!-- Host -->
  <g>
    <rect x="380" y="70" width="240" height="70" rx="14" fill="#37474f"/>
    <text x="500" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Máquina anfitriona (host)</text>
  </g>

  <path d="M420 140 L280 190" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M500 140 L500 190" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M580 140 L720 190" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Port forwarding -->
  <g>
    <rect x="140" y="195" width="220" height="105" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="250" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Port forwarding</text>
    <text x="250" y="248" text-anchor="middle" font-size="11" fill="#37474f">host:8080 → guest:80</text>
    <text x="250" y="268" text-anchor="middle" font-size="11" fill="#37474f">Accesible desde</text>
    <text x="250" y="286" text-anchor="middle" font-size="11" fill="#37474f">localhost del host</text>
  </g>

  <!-- Private network -->
  <g>
    <rect x="390" y="195" width="220" height="105" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="500" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">Red privada</text>
    <text x="500" y="248" text-anchor="middle" font-size="11" fill="#37474f">IP fija o DHCP</text>
    <text x="500" y="268" text-anchor="middle" font-size="11" fill="#37474f">Solo visible entre</text>
    <text x="500" y="286" text-anchor="middle" font-size="11" fill="#37474f">host y VMs del proyecto</text>
  </g>

  <!-- Public network -->
  <g>
    <rect x="640" y="195" width="220" height="105" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="750" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Red pública (bridge)</text>
    <text x="750" y="248" text-anchor="middle" font-size="11" fill="#37474f">La VM obtiene IP</text>
    <text x="750" y="268" text-anchor="middle" font-size="11" fill="#37474f">de la red local (LAN),</text>
    <text x="750" y="286" text-anchor="middle" font-size="11" fill="#37474f">visible en la red física</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
