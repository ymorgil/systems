<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="300" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Monitorización activa frente a pasiva en Zabbix</text>

  <g>
    <rect x="40" y="70" width="430" height="190" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="255" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Chequeos activos</text>

    <rect x="70" y="115" width="150" height="60" rx="10" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="145" y="150" text-anchor="middle" font-size="11" fill="#37474f">zabbix-agent2</text>

    <path d="M220 145 L280 145" stroke="#5e35b1" stroke-width="2.5" marker-end="url(#arrowp)"/>
    <text x="250" y="135" text-anchor="middle" font-size="9" fill="#5e35b1">envía datos</text>

    <rect x="285" y="115" width="150" height="60" rx="10" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="360" y="150" text-anchor="middle" font-size="11" fill="#37474f">Zabbix Server</text>

    <text x="255" y="200" text-anchor="middle" font-size="10" fill="#37474f">El agente pide su lista de items y</text>
    <text x="255" y="220" text-anchor="middle" font-size="10" fill="#37474f">envía los valores por su cuenta</text>
    <text x="255" y="240" text-anchor="middle" font-size="10" fill="#37474f">Escala mejor con muchos hosts</text>
  </g>

  <g>
    <rect x="530" y="70" width="430" height="190" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="745" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Chequeos pasivos</text>

    <rect x="560" y="115" width="150" height="60" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="635" y="150" text-anchor="middle" font-size="11" fill="#37474f">Zabbix Server</text>

    <path d="M710 145 L770 145" stroke="#00897b" stroke-width="2.5" marker-end="url(#arrowg)"/>
    <text x="740" y="135" text-anchor="middle" font-size="9" fill="#00897b">pregunta</text>

    <rect x="775" y="115" width="150" height="60" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="850" y="150" text-anchor="middle" font-size="11" fill="#37474f">zabbix-agent</text>

    <text x="745" y="200" text-anchor="middle" font-size="10" fill="#37474f">El servidor pregunta y espera</text>
    <text x="745" y="220" text-anchor="middle" font-size="10" fill="#37474f">respuesta directa del agente</text>
    <text x="745" y="240" text-anchor="middle" font-size="10" fill="#37474f">Más fácil de depurar</text>
  </g>

  <text x="500" y="285" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Cada item se configura como activo o pasivo según convenga a esa métrica</text>

  <defs>
    <marker id="arrowp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5e35b1"/>
    </marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00897b"/>
    </marker>
  </defs>
</svg>
