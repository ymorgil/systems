<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Arquitectura de Zabbix: server, proxy, agentes y base de datos</text>

  <!-- Agents -->
  <g>
    <rect x="30" y="90" width="200" height="170" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="130" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">Hosts con agente</text>
    <rect x="45" y="128" width="170" height="30" rx="6" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/>
    <text x="130" y="148" text-anchor="middle" font-size="10" fill="#37474f">zabbix-agent2 (activo)</text>
    <rect x="45" y="165" width="170" height="30" rx="6" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/>
    <text x="130" y="185" text-anchor="middle" font-size="10" fill="#37474f">zabbix-agent (pasivo)</text>
    <rect x="45" y="202" width="170" height="30" rx="6" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/>
    <text x="130" y="222" text-anchor="middle" font-size="10" fill="#37474f">SNMP / IPMI / JMX</text>
  </g>

  <path d="M230 175 L270 175" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Proxy -->
  <g>
    <rect x="275" y="110" width="160" height="130" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="355" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#ef6c00">Zabbix Proxy</text>
    <text x="355" y="165" text-anchor="middle" font-size="10" fill="#37474f">(opcional)</text>
    <text x="355" y="185" text-anchor="middle" font-size="9" fill="#37474f">Recolecta en la sede</text>
    <text x="355" y="200" text-anchor="middle" font-size="9" fill="#37474f">remota y reenvía</text>
  </g>

  <path d="M435 175 L480 175" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Server -->
  <g>
    <rect x="485" y="80" width="220" height="190" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="595" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Zabbix Server</text>
    <text x="595" y="130" text-anchor="middle" font-size="11" fill="#37474f">Pollers / Trappers</text>
    <text x="595" y="150" text-anchor="middle" font-size="11" fill="#37474f">Evaluación de triggers</text>
    <text x="595" y="170" text-anchor="middle" font-size="11" fill="#37474f">Motor de acciones</text>
    <text x="595" y="190" text-anchor="middle" font-size="11" fill="#37474f">Escalado de alertas</text>
    <text x="595" y="210" text-anchor="middle" font-size="11" fill="#37474f">API JSON-RPC</text>
  </g>

  <path d="M705 175 L745 175" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- DB -->
  <g>
    <rect x="750" y="120" width="120" height="110" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="810" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">Base de</text>
    <text x="810" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">datos</text>
    <text x="810" y="192" text-anchor="middle" font-size="9" fill="#37474f">MySQL / PostgreSQL</text>
  </g>

  <path d="M595 270 L595 285" stroke="#90a4ae" stroke-width="2"/>
  <g>
    <rect x="485" y="285" width="220" height="0" rx="0" fill="none"/>
  </g>

  <path d="M595 80 L595 55" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect x="500" y="10" width="190" height="0" fill="none"/>
  </g>
  <text x="595" y="40" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">Zabbix Frontend (PHP) / Web</text>

  <text x="500" y="298" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">El proxy es opcional: descarga al servidor central en despliegues multi-sede</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
