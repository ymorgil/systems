<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="300" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">De Item a Trigger a Acción en Zabbix</text>

  <g>
    <rect x="30" y="90" width="200" height="140" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="130" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">Item</text>
    <text x="130" y="145" text-anchor="middle" font-size="10" fill="#37474f">Dato recogido:</text>
    <text x="130" y="163" text-anchor="middle" font-size="10" fill="#37474f">CPU, memoria,</text>
    <text x="130" y="181" text-anchor="middle" font-size="10" fill="#37474f">espacio en disco...</text>
  </g>

  <path d="M230 160 L270 160" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="275" y="90" width="200" height="140" rx="14" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
    <text x="375" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#ad1457">Trigger</text>
    <text x="375" y="145" text-anchor="middle" font-size="10" fill="#37474f">Expresión lógica</text>
    <text x="375" y="163" text-anchor="middle" font-size="10" fill="#37474f">last(/host/item)&gt;90</text>
    <text x="375" y="181" text-anchor="middle" font-size="10" fill="#37474f">Severidad asignada</text>
  </g>

  <path d="M475 160 L515 160" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="520" y="90" width="200" height="140" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="620" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#ef6c00">Acción</text>
    <text x="620" y="145" text-anchor="middle" font-size="10" fill="#37474f">Condiciones +</text>
    <text x="620" y="163" text-anchor="middle" font-size="10" fill="#37474f">operaciones</text>
    <text x="620" y="181" text-anchor="middle" font-size="10" fill="#37474f">Escalado por pasos</text>
  </g>

  <path d="M720 160 L760 160" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="765" y="90" width="200" height="140" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="865" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Notificación</text>
    <text x="865" y="145" text-anchor="middle" font-size="10" fill="#37474f">Email, SMS, Slack,</text>
    <text x="865" y="163" text-anchor="middle" font-size="10" fill="#37474f">script personalizado</text>
  </g>

  <text x="500" y="270" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Un template agrupa items y triggers reutilizables para aplicar a muchos hosts a la vez</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
