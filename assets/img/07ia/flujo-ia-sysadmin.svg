<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Ciclo de trabajo de un sysadmin asistido por IA</text>

  <!-- Monitorización -->
  <g>
    <rect x="20" y="90" width="150" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="95" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Monitorización</text>
    <text x="95" y="148" text-anchor="middle" font-size="11" fill="#37474f">Métricas, logs</text>
    <text x="95" y="166" text-anchor="middle" font-size="11" fill="#37474f">y trazas</text>
    <text x="95" y="190" text-anchor="middle" font-size="11" fill="#37474f">Motor AIOps</text>
    <text x="95" y="208" text-anchor="middle" font-size="11" fill="#37474f">(Watchdog,</text>
    <text x="95" y="224" text-anchor="middle" font-size="11" fill="#37474f">Davis AI...)</text>
  </g>

  <path d="M170 165 L212 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- Deteccion anomalia -->
  <g>
    <rect x="216" y="90" width="150" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="291" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Detección de</text>
    <text x="291" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">anomalía</text>
    <text x="291" y="168" text-anchor="middle" font-size="11" fill="#37474f">Pico de latencia,</text>
    <text x="291" y="186" text-anchor="middle" font-size="11" fill="#37474f">disco casi lleno,</text>
    <text x="291" y="204" text-anchor="middle" font-size="11" fill="#37474f">patrón de acceso</text>
    <text x="291" y="222" text-anchor="middle" font-size="11" fill="#37474f">inusual</text>
  </g>

  <path d="M366 165 L408 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- Sugerencia IA -->
  <g>
    <rect x="412" y="80" width="170" height="170" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="497" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Sugerencia de IA</text>
    <text x="497" y="138" text-anchor="middle" font-size="11" fill="#37474f">Diagnóstico probable</text>
    <text x="497" y="156" text-anchor="middle" font-size="11" fill="#37474f">Playbook / script</text>
    <text x="497" y="174" text-anchor="middle" font-size="11" fill="#37474f">generado (Copilot,</text>
    <text x="497" y="192" text-anchor="middle" font-size="11" fill="#37474f">Lightspeed, LLM local)</text>
    <text x="497" y="216" text-anchor="middle" font-size="11" fill="#37474f" font-style="italic">Nivel de confianza</text>
  </g>

  <path d="M582 165 L624 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- Validacion humana -->
  <g>
    <rect x="628" y="80" width="170" height="170" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="713" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#ef6c00">Validación humana</text>
    <text x="713" y="138" text-anchor="middle" font-size="11" fill="#37474f">Revisión del criterio</text>
    <text x="713" y="156" text-anchor="middle" font-size="11" fill="#37474f">técnico y de negocio</text>
    <text x="713" y="174" text-anchor="middle" font-size="11" fill="#37474f">Comprobación en</text>
    <text x="713" y="192" text-anchor="middle" font-size="11" fill="#37474f">entorno de pruebas</text>
    <text x="713" y="216" text-anchor="middle" font-size="11" fill="#37474f" font-style="italic">¿Aprobar o descartar?</text>
  </g>

  <path d="M798 165 L840 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- Aplicacion cambio -->
  <g>
    <rect x="844" y="90" width="140" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="914" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Aplicación</text>
    <text x="914" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">del cambio</text>
    <text x="914" y="166" text-anchor="middle" font-size="11" fill="#37474f">Ansible / Terraform</text>
    <text x="914" y="184" text-anchor="middle" font-size="11" fill="#37474f">Control de versiones</text>
    <text x="914" y="202" text-anchor="middle" font-size="11" fill="#37474f">Registro y auditoría</text>
  </g>

  <!-- Feedback loop -->
  <path d="M914 240 L914 270 L95 270 L95 240" stroke="#90a4ae" stroke-width="2" fill="none" stroke-dasharray="6,5" marker-end="url(#arrow2)"/>
  <text x="500" y="290" text-anchor="middle" font-size="11" fill="#607d8b" font-style="italic">El resultado retroalimenta el modelo de monitorización: aprendizaje continuo del entorno</text>

  <text x="500" y="310" text-anchor="middle" font-size="11" fill="#607d8b" font-style="italic">La IA propone, el administrador decide: el humano permanece en el bucle (human-in-the-loop)</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
