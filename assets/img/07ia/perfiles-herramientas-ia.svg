<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="340" rx="18" fill="#f7f6fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Perfiles profesionales y sus herramientas de IA de referencia</text>

  <!-- Sysadmin clasico -->
  <g>
    <rect x="30" y="70" width="280" height="230" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="170" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#00897b">Sysadmin clásico</text>
    <line x1="55" y1="112" x2="285" y2="112" stroke="#00897b" stroke-width="1"/>
    <text x="170" y="136" text-anchor="middle" font-size="11" fill="#37474f">Copilot / asistentes de shell</text>
    <text x="170" y="156" text-anchor="middle" font-size="11" fill="#37474f">Ansible Lightspeed</text>
    <text x="170" y="176" text-anchor="middle" font-size="11" fill="#37474f">AIOps: Datadog Watchdog,</text>
    <text x="170" y="194" text-anchor="middle" font-size="11" fill="#37474f">Dynatrace Davis</text>
    <text x="170" y="214" text-anchor="middle" font-size="11" fill="#37474f">Chatbots de infraestructura</text>
    <text x="170" y="234" text-anchor="middle" font-size="11" fill="#37474f">LLM local para runbooks</text>
    <text x="170" y="260" text-anchor="middle" font-size="11" fill="#607d8b" font-style="italic">Foco: reducir tareas</text>
    <text x="170" y="278" text-anchor="middle" font-size="11" fill="#607d8b" font-style="italic">repetitivas de operación</text>
  </g>

  <!-- DevOps -->
  <g>
    <rect x="360" y="70" width="280" height="230" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="500" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#5e35b1">DevOps / Cloud</text>
    <line x1="385" y1="112" x2="615" y2="112" stroke="#5e35b1" stroke-width="1"/>
    <text x="500" y="136" text-anchor="middle" font-size="11" fill="#37474f">IA generativa de IaC</text>
    <text x="500" y="156" text-anchor="middle" font-size="11" fill="#37474f">(Terraform + Copilot)</text>
    <text x="500" y="176" text-anchor="middle" font-size="11" fill="#37474f">MCP para orquestar APIs</text>
    <text x="500" y="196" text-anchor="middle" font-size="11" fill="#37474f">Pipelines CI/CD con revisión IA</text>
    <text x="500" y="216" text-anchor="middle" font-size="11" fill="#37474f">Kubernetes + modelos ML</text>
    <text x="500" y="236" text-anchor="middle" font-size="11" fill="#37474f">en contenedores (MLOps)</text>
    <text x="500" y="260" text-anchor="middle" font-size="11" fill="#607d8b" font-style="italic">Foco: automatizar el</text>
    <text x="500" y="278" text-anchor="middle" font-size="11" fill="#607d8b" font-style="italic">ciclo de despliegue completo</text>
  </g>

  <!-- Ciberseguridad -->
  <g>
    <rect x="690" y="70" width="280" height="230" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="830" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#ef6c00">Ciberseguridad</text>
    <line x1="715" y1="112" x2="945" y2="112" stroke="#ef6c00" stroke-width="1"/>
    <text x="830" y="136" text-anchor="middle" font-size="11" fill="#37474f">SIEM con IA (Sentinel,</text>
    <text x="830" y="154" text-anchor="middle" font-size="11" fill="#37474f">Microsoft Copilot Security)</text>
    <text x="830" y="174" text-anchor="middle" font-size="11" fill="#37474f">Detección de amenazas</text>
    <text x="830" y="192" text-anchor="middle" font-size="11" fill="#37474f">basada en ML (EDR/XDR)</text>
    <text x="830" y="212" text-anchor="middle" font-size="11" fill="#37474f">Análisis de malware asistido</text>
    <text x="830" y="232" text-anchor="middle" font-size="11" fill="#37474f">LLM local para datos sensibles</text>
    <text x="830" y="260" text-anchor="middle" font-size="11" fill="#607d8b" font-style="italic">Foco: acelerar detección</text>
    <text x="830" y="278" text-anchor="middle" font-size="11" fill="#607d8b" font-style="italic">y respuesta a incidentes</text>
  </g>

  <text x="500" y="322" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Los tres perfiles comparten una base: prompting técnico, validación humana y seguridad del dato</text>
</svg>
