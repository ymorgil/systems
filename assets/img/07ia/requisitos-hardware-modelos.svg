<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="340" rx="18" fill="#f7f6fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Qué tamaño de modelo encaja con el equipo de un instituto</text>

  <!-- Ligero -->
  <g>
    <rect x="30" y="70" width="280" height="230" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="170" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#00897b">Ligero (0,5-1B)</text>
    <line x1="55" y1="112" x2="285" y2="112" stroke="#00897b" stroke-width="1"/>
    <text x="170" y="136" text-anchor="middle" font-size="11" fill="#37474f">RAM: 4-8 GB, solo CPU</text>
    <text x="170" y="156" text-anchor="middle" font-size="11" fill="#37474f">Sin GPU necesaria</text>
    <text x="170" y="176" text-anchor="middle" font-size="11" fill="#37474f">Velocidad: alta</text>
    <text x="170" y="196" text-anchor="middle" font-size="11" fill="#37474f">Uso: chat sencillo,</text>
    <text x="170" y="214" text-anchor="middle" font-size="11" fill="#37474f">resumir textos cortos</text>
    <text x="170" y="242" text-anchor="middle" font-size="11" fill="#00897b" font-weight="700">✓ Ideal para el aula</text>
    <text x="170" y="262" text-anchor="middle" font-size="11" fill="#00897b" font-weight="700">sin GPU dedicada</text>
  </g>

  <!-- Medio -->
  <g>
    <rect x="360" y="70" width="280" height="230" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="500" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#5e35b1">Medio (2-4B)</text>
    <line x1="385" y1="112" x2="615" y2="112" stroke="#5e35b1" stroke-width="1"/>
    <text x="500" y="136" text-anchor="middle" font-size="11" fill="#37474f">RAM: 8-16 GB, solo CPU</text>
    <text x="500" y="156" text-anchor="middle" font-size="11" fill="#37474f">GPU integrada ayuda,</text>
    <text x="500" y="174" text-anchor="middle" font-size="11" fill="#37474f">no imprescindible</text>
    <text x="500" y="196" text-anchor="middle" font-size="11" fill="#37474f">Velocidad: media</text>
    <text x="500" y="216" text-anchor="middle" font-size="11" fill="#37474f">Uso: instrucciones, texto</text>
    <text x="500" y="234" text-anchor="middle" font-size="11" fill="#37474f">estructurado, código simple</text>
    <text x="500" y="262" text-anchor="middle" font-size="11" fill="#5e35b1" font-weight="700">✓ Buen equilibrio</text>
    <text x="500" y="280" text-anchor="middle" font-size="11" fill="#5e35b1" font-weight="700">para un PC de aula</text>
  </g>

  <!-- Grande -->
  <g>
    <rect x="690" y="70" width="280" height="230" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="830" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#ef6c00">Grande (7-8B)</text>
    <line x1="715" y1="112" x2="945" y2="112" stroke="#ef6c00" stroke-width="1"/>
    <text x="830" y="136" text-anchor="middle" font-size="11" fill="#37474f">RAM: 16 GB+ / GPU 8-12 GB</text>
    <text x="830" y="156" text-anchor="middle" font-size="11" fill="#37474f">VRAM recomendada</text>
    <text x="830" y="176" text-anchor="middle" font-size="11" fill="#37474f">Sin GPU: muy lento</text>
    <text x="830" y="196" text-anchor="middle" font-size="11" fill="#37474f">Uso: ajuste fino LoRA/QLoRA,</text>
    <text x="830" y="214" text-anchor="middle" font-size="11" fill="#37474f">tareas más complejas</text>
    <text x="830" y="242" text-anchor="middle" font-size="11" fill="#ef6c00" font-weight="700">△ Mejor con GPU gratuita</text>
    <text x="830" y="260" text-anchor="middle" font-size="11" fill="#ef6c00" font-weight="700">en la nube (Colab)</text>
  </g>

  <text x="500" y="324" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Con CPU, 8-16 GB de RAM y sin GPU dedicada, los modelos ligeros y medios son la opción realista para inferencia diaria</text>
</svg>
