<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Riesgos de usar IA en sistemas y cómo mitigarlos</text>

  <!-- Columna riesgo 1 -->
  <g>
    <rect x="30" y="70" width="220" height="200" rx="14" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="140" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">Alucinaciones</text>
    <text x="140" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">en scripts</text>
    <text x="140" y="145" text-anchor="middle" font-size="10" fill="#37474f">Comandos inventados,</text>
    <text x="140" y="161" text-anchor="middle" font-size="10" fill="#37474f">flags que no existen,</text>
    <text x="140" y="177" text-anchor="middle" font-size="10" fill="#37474f">rutas incorrectas</text>
    <line x1="50" y1="192" x2="230" y2="192" stroke="#c62828" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="140" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#00897b">Mitigación:</text>
    <text x="140" y="230" text-anchor="middle" font-size="10" fill="#37474f">probar en entorno</text>
    <text x="140" y="246" text-anchor="middle" font-size="10" fill="#37474f">aislado antes de</text>
    <text x="140" y="262" text-anchor="middle" font-size="10" fill="#37474f">producción</text>
  </g>

  <!-- Columna riesgo 2 -->
  <g>
    <rect x="270" y="70" width="220" height="200" rx="14" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="380" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">Exfiltración</text>
    <text x="380" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">de datos</text>
    <text x="380" y="145" text-anchor="middle" font-size="10" fill="#37474f">Logs, credenciales o</text>
    <text x="380" y="161" text-anchor="middle" font-size="10" fill="#37474f">topología de red enviados</text>
    <text x="380" y="177" text-anchor="middle" font-size="10" fill="#37474f">a un servicio en la nube</text>
    <line x1="290" y1="192" x2="470" y2="192" stroke="#c62828" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="380" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#00897b">Mitigación:</text>
    <text x="380" y="230" text-anchor="middle" font-size="10" fill="#37474f">LLM locales/on-premise</text>
    <text x="380" y="246" text-anchor="middle" font-size="10" fill="#37474f">para datos sensibles,</text>
    <text x="380" y="262" text-anchor="middle" font-size="10" fill="#37474f">políticas de uso claras</text>
  </g>

  <!-- Columna riesgo 3 -->
  <g>
    <rect x="510" y="70" width="220" height="200" rx="14" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="620" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">Sobre-</text>
    <text x="620" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">dependencia</text>
    <text x="620" y="145" text-anchor="middle" font-size="10" fill="#37474f">Pérdida de criterio propio,</text>
    <text x="620" y="161" text-anchor="middle" font-size="10" fill="#37474f">aceptar sugerencias sin</text>
    <text x="620" y="177" text-anchor="middle" font-size="10" fill="#37474f">entenderlas</text>
    <line x1="530" y1="192" x2="710" y2="192" stroke="#c62828" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="620" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#00897b">Mitigación:</text>
    <text x="620" y="230" text-anchor="middle" font-size="10" fill="#37474f">formación continua,</text>
    <text x="620" y="246" text-anchor="middle" font-size="10" fill="#37474f">revisión de código</text>
    <text x="620" y="262" text-anchor="middle" font-size="10" fill="#37474f">por pares</text>
  </g>

  <!-- Columna riesgo 4 -->
  <g>
    <rect x="750" y="70" width="220" height="200" rx="14" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="860" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">Sesgo y falsos</text>
    <text x="860" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">positivos AIOps</text>
    <text x="860" y="145" text-anchor="middle" font-size="10" fill="#37474f">Alertas irrelevantes o</text>
    <text x="860" y="161" text-anchor="middle" font-size="10" fill="#37474f">anomalías reales sin</text>
    <text x="860" y="177" text-anchor="middle" font-size="10" fill="#37474f">detectar</text>
    <line x1="770" y1="192" x2="950" y2="192" stroke="#c62828" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="860" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#00897b">Mitigación:</text>
    <text x="860" y="230" text-anchor="middle" font-size="10" fill="#37474f">ajustar umbrales,</text>
    <text x="860" y="246" text-anchor="middle" font-size="10" fill="#37474f">auditoría periódica</text>
    <text x="860" y="262" text-anchor="middle" font-size="10" fill="#37474f">del modelo</text>
  </g>

  <text x="500" y="300" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">En todos los casos, la validación humana es la última barrera antes de tocar un sistema en producción</text>
</svg>
