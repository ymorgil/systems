    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="300" rx="18" fill="url(#bg)"/>
  <text x="500" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#37474f">Administración de Sistemas Operativos: recorrido por las 7 unidades</text>
  <line x1="65" y1="150" x2="935" y2="150" stroke="#b39ddb" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>

  <g>
