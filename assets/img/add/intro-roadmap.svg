    <text x="65" y="144" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">UT1</text>
    <text x="65" y="161" text-anchor="middle" fill="#fff" font-size="10">RA1</text>
    <text x="65" y="210" text-anchor="middle" fill="#37474f" font-size="11" font-weight="600">Servicio de</text>
    <text x="65" y="224" text-anchor="middle" fill="#37474f" font-size="11" font-weight="600">directorio</text>
  </g>

