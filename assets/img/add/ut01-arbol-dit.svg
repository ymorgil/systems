<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="300" rx="18" fill="#f7f6fb"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#37474f">Árbol de información del directorio (DIT): dc=nombre,dc=local</text>

  <!-- Raiz -->
  <rect x="420" y="55" width="160" height="45" rx="12" fill="#5e35b1" stroke="#37474f" stroke-width="1.5"/>
  <text x="500" y="83" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">dc=nombre,dc=local</text>

  <!-- Lineas hacia OUs -->
  <path d="M500 100 L200 140" stroke="#90a4ae" stroke-width="2"/>
  <path d="M500 100 L420 140" stroke="#90a4ae" stroke-width="2"/>
  <path d="M500 100 L620 140" stroke="#90a4ae" stroke-width="2"/>
  <path d="M500 100 L840 140" stroke="#90a4ae" stroke-width="2"/>

  <!-- OU Usuarios -->
  <rect x="110" y="140" width="180" height="42" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="200" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">ou=Usuarios</text>

  <!-- OU Grupos -->
  <rect x="330" y="140" width="180" height="42" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="420" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">ou=Grupos</text>

  <!-- OU Equipos -->
  <rect x="530" y="140" width="180" height="42" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="620" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">ou=Equipos</text>

  <!-- Domain Controllers -->
  <rect x="750" y="140" width="180" height="42" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="840" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#5e35b1">ou=Domain</text>
  <text x="840" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#5e35b1">Controllers</text>

  <!-- Hojas bajo Usuarios -->
  <path d="M160 182 L110 225" stroke="#90a4ae" stroke-width="1.5"/>
  <path d="M240 182 L240 225" stroke="#90a4ae" stroke-width="1.5"/>

  <rect x="45" y="225" width="130" height="50" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
  <text x="110" y="246" text-anchor="middle" font-size="10" fill="#37474f" font-weight="700">cn=profesor01</text>
  <text x="110" y="262" text-anchor="middle" font-size="9" fill="#37474f">uid, uidNumber, homeDirectory</text>

  <rect x="185" y="225" width="130" height="50" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
  <text x="250" y="246" text-anchor="middle" font-size="10" fill="#37474f" font-weight="700">cn=alumno01</text>
  <text x="250" y="262" text-anchor="middle" font-size="9" fill="#37474f">objectClass: posixAccount</text>

  <!-- Hoja bajo Grupos -->
  <path d="M420 182 L420 225" stroke="#90a4ae" stroke-width="1.5"/>
  <rect x="355" y="225" width="130" height="50" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
  <text x="420" y="246" text-anchor="middle" font-size="10" fill="#37474f" font-weight="700">cn=profesores</text>
  <text x="420" y="262" text-anchor="middle" font-size="9" fill="#37474f">objectClass: posixGroup</text>

  <text x="500" y="292" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Cada rama y hoja se identifica por su DN (Distinguished Name)</text>
</svg>
