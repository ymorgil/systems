<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#37474f">Autenticación centralizada: del cliente al servicio de directorio</text>

  <!-- Cliente Windows -->
  <g>
    <rect x="20" y="80" width="150" height="80" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="95" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Cliente Windows</text>
    <text x="95" y="128" text-anchor="middle" font-size="11" fill="#37474f">Inicio de sesión</text>
    <text x="95" y="145" text-anchor="middle" font-size="11" fill="#37474f">de dominio</text>
  </g>

  <!-- Cliente Linux -->
  <g>
    <rect x="20" y="175" width="150" height="80" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="95" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Cliente Linux</text>
    <text x="95" y="223" text-anchor="middle" font-size="11" fill="#37474f">realmd / sssd</text>
    <text x="95" y="240" text-anchor="middle" font-size="11" fill="#37474f">winbind</text>
  </g>

  <path d="M170 120 L212 138" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M170 215 L212 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- NSS/PAM -->
  <g>
    <rect x="217" y="105" width="150" height="90" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="292" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">NSS / PAM</text>
    <text x="292" y="155" text-anchor="middle" font-size="11" fill="#37474f">Kerberos (TGT)</text>
    <text x="292" y="173" text-anchor="middle" font-size="11" fill="#37474f">LDAP bind</text>
  </g>

  <path d="M367 150 L410 150" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Servicio de directorio (nucleo) -->
  <g>
    <rect x="415" y="70" width="200" height="180" rx="16" fill="#ede7f6" stroke="#5e35b1" stroke-width="2.5"/>
    <text x="515" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Servicio de directorio</text>
    <text x="515" y="120" text-anchor="middle" font-size="11" fill="#37474f">AD DS / OpenLDAP / Samba4</text>
    <ellipse cx="515" cy="155" rx="60" ry="16" fill="#5e35b1"/>
    <rect x="455" y="155" width="120" height="35" fill="#5e35b1"/>
    <ellipse cx="515" cy="190" rx="60" ry="16" fill="#5e35b1"/>
    <text x="515" y="176" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">DIT</text>
    <text x="515" y="222" text-anchor="middle" font-size="10" fill="#37474f">dc=nombre,dc=local</text>
    <text x="515" y="238" text-anchor="middle" font-size="10" fill="#37474f">OUs · usuarios · grupos</text>
  </g>

  <path d="M615 130 L657 130" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M615 190 L657 190" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- DNS -->
  <g>
    <rect x="662" y="100" width="140" height="60" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="732" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">DNS</text>
    <text x="732" y="145" text-anchor="middle" font-size="11" fill="#37474f">registros SRV</text>
  </g>

  <!-- GPO -->
  <g>
    <rect x="662" y="165" width="140" height="60" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="732" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">GPO</text>
    <text x="732" y="210" text-anchor="middle" font-size="11" fill="#37474f">directivas de grupo</text>
  </g>

  <path d="M802 130 L845 145" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M802 195 L845 175" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Herramientas -->
  <g>
    <rect x="850" y="75" width="130" height="170" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="915" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Herramientas</text>
    <text x="915" y="126" text-anchor="middle" font-size="10" fill="#37474f">ADUC</text>
    <text x="915" y="144" text-anchor="middle" font-size="10" fill="#37474f">ldapsearch / ldapadd</text>
    <text x="915" y="162" text-anchor="middle" font-size="10" fill="#37474f">samba-tool</text>
    <text x="915" y="180" text-anchor="middle" font-size="10" fill="#37474f">phpLDAPadmin</text>
    <text x="915" y="198" text-anchor="middle" font-size="10" fill="#37474f">LDAP Account Manager</text>
    <text x="915" y="216" text-anchor="middle" font-size="10" fill="#37474f">Apache Directory Studio</text>
  </g>

  <text x="500" y="285" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">UT1 · Servicio de directorio: autenticación y autorización centralizadas</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
