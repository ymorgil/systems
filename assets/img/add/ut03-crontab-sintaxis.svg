<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Sintaxis de una entrada crontab</text>

  <!-- Linea de campos -->
  <g font-family="Consolas, monospace" font-size="22" font-weight="700">
    <rect x="60" y="70" width="90" height="55" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="105" y="105" text-anchor="middle" fill="#5e35b1">m</text>

    <rect x="170" y="70" width="90" height="55" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="215" y="105" text-anchor="middle" fill="#5e35b1">h</text>

    <rect x="280" y="70" width="120" height="55" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="340" y="105" text-anchor="middle" fill="#5e35b1">dom</text>

    <rect x="420" y="70" width="120" height="55" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="480" y="105" text-anchor="middle" fill="#5e35b1">mon</text>

    <rect x="560" y="70" width="120" height="55" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="620" y="105" text-anchor="middle" fill="#5e35b1">dow</text>

    <rect x="700" y="70" width="250" height="55" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="825" y="105" text-anchor="middle" font-size="18" fill="#00897b">comando</text>
  </g>

  <!-- Lineas descriptivas -->
  <g font-size="11" fill="#37474f">
    <line x1="105" y1="125" x2="105" y2="150" stroke="#90a4ae" stroke-width="1.5"/>
    <text x="105" y="165" text-anchor="middle">minuto</text>
    <text x="105" y="180" text-anchor="middle">(0-59)</text>

    <line x1="215" y1="125" x2="215" y2="150" stroke="#90a4ae" stroke-width="1.5"/>
    <text x="215" y="165" text-anchor="middle">hora</text>
    <text x="215" y="180" text-anchor="middle">(0-23)</text>

    <line x1="340" y1="125" x2="340" y2="150" stroke="#90a4ae" stroke-width="1.5"/>
    <text x="340" y="165" text-anchor="middle">día del mes</text>
    <text x="340" y="180" text-anchor="middle">(1-31)</text>

    <line x1="480" y1="125" x2="480" y2="150" stroke="#90a4ae" stroke-width="1.5"/>
    <text x="480" y="165" text-anchor="middle">mes</text>
    <text x="480" y="180" text-anchor="middle">(1-12)</text>

    <line x1="620" y1="125" x2="620" y2="150" stroke="#90a4ae" stroke-width="1.5"/>
    <text x="620" y="165" text-anchor="middle">día semana</text>
    <text x="620" y="180" text-anchor="middle">(0-7, 0=dom)</text>

    <line x1="825" y1="125" x2="825" y2="150" stroke="#90a4ae" stroke-width="1.5"/>
    <text x="825" y="165" text-anchor="middle">ruta absoluta del script</text>
    <text x="825" y="180" text-anchor="middle">o comando a ejecutar</text>
  </g>

  <!-- Ejemplo -->
  <rect x="60" y="210" width="890" height="70" rx="12" fill="#37474f"/>
  <text x="90" y="240" font-size="16" font-family="Consolas, monospace" fill="#ffffff">*/15 2 * * 1-5  /scripts/backup_home.sh</text>
  <text x="90" y="262" font-size="12" fill="#b0bec5">→ cada 15 minutos, a partir de las 2:00, de lunes a viernes, ejecuta el script de copia de seguridad</text>

  <text x="500" y="305" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Operadores: * (cualquiera) · , (lista) · - (rango) · / (intervalo) · @reboot (al arrancar)</text>
</svg>
