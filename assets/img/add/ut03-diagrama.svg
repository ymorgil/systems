<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Anatomía de una tarea automatizada: desencadenante, acción y registro</text>

  <!-- Trigger tiempo -->
  <g>
    <rect x="30" y="90" width="160" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="110" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Trigger: tiempo</text>
    <text x="110" y="150" text-anchor="middle" font-size="11" fill="#37474f">cron: m h dom mon dow</text>
    <text x="110" y="170" text-anchor="middle" font-size="11" fill="#37474f">at: ejecución única</text>
    <text x="110" y="190" text-anchor="middle" font-size="11" fill="#37474f">Task Scheduler:</text>
    <text x="110" y="207" text-anchor="middle" font-size="11" fill="#37474f">programación hora/fecha</text>
  </g>

  <!-- Trigger evento -->
  <g>
    <rect x="30" y="250" width="160" height="0" rx="14" fill="none"/>
  </g>
  <text x="110" y="260" text-anchor="middle" font-size="11" fill="#607d8b" font-style="italic">o bien un evento</text>

  <path d="M190 165 L235 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow3)"/>

  <!-- Trigger evento box -->
  <g>
    <rect x="30" y="20" width="0" height="0" fill="none"/>
  </g>

  <!-- Evaluación de condiciones -->
  <g>
    <rect x="240" y="90" width="160" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="320" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Condiciones</text>
    <text x="320" y="150" text-anchor="middle" font-size="11" fill="#37474f">¿Equipo inactivo?</text>
    <text x="320" y="170" text-anchor="middle" font-size="11" fill="#37474f">¿Con red disponible?</text>
    <text x="320" y="190" text-anchor="middle" font-size="11" fill="#37474f">¿Con alimentación?</text>
    <text x="320" y="207" text-anchor="middle" font-size="11" fill="#37474f">Restricciones seguridad</text>
  </g>

  <path d="M400 165 L445 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow3)"/>

  <!-- Accion -->
  <g>
    <rect x="450" y="80" width="180" height="170" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="540" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Acción</text>
    <text x="540" y="140" text-anchor="middle" font-size="11" fill="#37474f">Ejecutar script /</text>
    <text x="540" y="157" text-anchor="middle" font-size="11" fill="#37474f">programa / comando</text>
    <text x="540" y="180" text-anchor="middle" font-size="11" fill="#37474f">Backup, limpieza,</text>
    <text x="540" y="197" text-anchor="middle" font-size="11" fill="#37474f">alta de usuarios,</text>
    <text x="540" y="214" text-anchor="middle" font-size="11" fill="#37474f">envío de aviso...</text>
  </g>

  <path d="M630 165 L675 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow3)"/>

  <!-- Resultado -->
  <g>
    <rect x="680" y="90" width="150" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="755" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Resultado</text>
    <text x="755" y="150" text-anchor="middle" font-size="11" fill="#37474f">Éxito / error</text>
    <text x="755" y="170" text-anchor="middle" font-size="11" fill="#37474f">Reintentos</text>
    <text x="755" y="190" text-anchor="middle" font-size="11" fill="#37474f">Detener si tarda</text>
    <text x="755" y="207" text-anchor="middle" font-size="11" fill="#37474f">demasiado</text>
  </g>

  <path d="M830 165 L875 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow3)"/>

  <!-- Log -->
  <g>
    <rect x="880" y="90" width="90" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="925" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Log</text>
    <text x="925" y="155" text-anchor="middle" font-size="10" fill="#37474f">/var/log</text>
    <text x="925" y="172" text-anchor="middle" font-size="10" fill="#37474f">Visor de</text>
    <text x="925" y="187" text-anchor="middle" font-size="10" fill="#37474f">eventos</text>
    <text x="925" y="207" text-anchor="middle" font-size="10" fill="#37474f">Documentación</text>
  </g>

  <text x="500" y="290" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">UT03 · Automatización de tareas — de un disparador a una acción documentada</text>

  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
