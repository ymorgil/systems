<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Arquitectura del Programador de tareas de Windows</text>

  <!-- Caja general -->
  <rect x="60" y="60" width="230" height="220" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="175" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">General</text>
  <text x="175" y="115" text-anchor="middle" font-size="11" fill="#37474f">Nombre y descripción</text>
  <text x="175" y="135" text-anchor="middle" font-size="11" fill="#37474f">Usuario de ejecución</text>
  <text x="175" y="155" text-anchor="middle" font-size="11" fill="#37474f">Ejecutar con sesión</text>
  <text x="175" y="172" text-anchor="middle" font-size="11" fill="#37474f">iniciada o no</text>
  <text x="175" y="195" text-anchor="middle" font-size="11" fill="#37474f">Privilegios</text>
  <text x="175" y="215" text-anchor="middle" font-size="11" fill="#37474f">(más altos o no)</text>

  <path d="M290 170 L330 170" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow4)"/>

  <!-- Desencadenadores -->
  <rect x="335" y="60" width="230" height="220" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Desencadenadores</text>
  <text x="450" y="112" text-anchor="middle" font-size="11" fill="#37474f">Programación (hora/fecha)</text>
  <text x="450" y="130" text-anchor="middle" font-size="11" fill="#37474f">Al iniciar sesión</text>
  <text x="450" y="148" text-anchor="middle" font-size="11" fill="#37474f">Al iniciar el sistema</text>
  <text x="450" y="166" text-anchor="middle" font-size="11" fill="#37474f">Al estar inactivo</text>
  <text x="450" y="184" text-anchor="middle" font-size="11" fill="#37474f">Al producirse un evento</text>
  <text x="450" y="202" text-anchor="middle" font-size="11" fill="#37474f">Al conectar/desconectar</text>
  <text x="450" y="220" text-anchor="middle" font-size="11" fill="#37474f">Al bloquear/desbloquear</text>
  <text x="450" y="238" text-anchor="middle" font-size="11" fill="#37474f">sesión</text>

  <path d="M565 170 L605 170" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow4)"/>

  <!-- Acciones -->
  <rect x="610" y="60" width="180" height="220" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="700" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Acciones</text>
  <text x="700" y="115" text-anchor="middle" font-size="11" fill="#37474f">Iniciar un programa</text>
  <text x="700" y="133" text-anchor="middle" font-size="11" fill="#37474f">Enviar un correo</text>
  <text x="700" y="151" text-anchor="middle" font-size="11" fill="#37474f">Mostrar un mensaje</text>
  <text x="700" y="175" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">(añadir / editar /</text>
  <text x="700" y="190" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">eliminar)</text>

  <path d="M795 170 L835 170" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow4)"/>

  <!-- Condiciones + Config -->
  <rect x="840" y="60" width="105" height="220" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="892" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">Condiciones</text>
  <text x="892" y="105" text-anchor="middle" font-size="10" fill="#37474f">Inactividad</text>
  <text x="892" y="120" text-anchor="middle" font-size="10" fill="#37474f">Energía</text>
  <text x="892" y="135" text-anchor="middle" font-size="10" fill="#37474f">Red</text>
  <text x="892" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">Configuración</text>
  <text x="892" y="185" text-anchor="middle" font-size="10" fill="#37474f">Reintentos</text>
  <text x="892" y="200" text-anchor="middle" font-size="10" fill="#37474f">Detener si tarda</text>
  <text x="892" y="215" text-anchor="middle" font-size="10" fill="#37474f">Ejecutar a</text>
  <text x="892" y="228" text-anchor="middle" font-size="10" fill="#37474f">petición</text>

  <text x="500" y="305" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Equivalente en PowerShell: New-ScheduledTask + Get-ScheduledTask + Register-ScheduledTask</text>

  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
