<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="340" rx="18" fill="#f7f6fb"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#37474f">Sesión frente a sin sesión: dos formas de administrar en remoto</text>

  <!-- Columna orientado a sesion -->
  <g>
    <rect x="60" y="65" width="400" height="245" rx="16" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="260" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#5e35b1">Orientado a sesión</text>
    <circle cx="90" cy="125" r="4" fill="#5e35b1"/>
    <text x="105" y="130" font-size="11" fill="#37474f">Mantiene un estado durante toda la conexión</text>
    <circle cx="90" cy="150" r="4" fill="#5e35b1"/>
    <text x="105" y="155" font-size="11" fill="#37474f">Requiere autenticación al inicio de la sesión</text>
    <circle cx="90" cy="175" r="4" fill="#5e35b1"/>
    <text x="105" y="180" font-size="11" fill="#37474f">Escritorio o shell interactivos</text>
    <circle cx="90" cy="200" r="4" fill="#5e35b1"/>
    <text x="105" y="205" font-size="11" fill="#37474f">Ejemplos: SSH, RDP, VNC, Telnet</text>
    <circle cx="90" cy="225" r="4" fill="#5e35b1"/>
    <text x="105" y="230" font-size="11" fill="#37474f">La caída de la conexión interrumpe la tarea</text>
    <circle cx="90" cy="250" r="4" fill="#5e35b1"/>
    <text x="105" y="255" font-size="11" fill="#37474f">Uso típico: soporte técnico, trabajo interactivo</text>
    <circle cx="90" cy="275" r="4" fill="#5e35b1"/>
    <text x="105" y="280" font-size="11" fill="#37474f">tmux/tmate permiten persistir la sesión</text>
  </g>

  <!-- Columna sin sesion -->
  <g>
    <rect x="540" y="65" width="400" height="245" rx="16" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="740" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#00897b">No orientado a sesión</text>
    <circle cx="570" cy="125" r="4" fill="#00897b"/>
    <text x="585" y="130" font-size="11" fill="#37474f">Cada petición es independiente (sin estado)</text>
    <circle cx="570" cy="150" r="4" fill="#00897b"/>
    <text x="585" y="155" font-size="11" fill="#37474f">Pensado para automatización y scripts</text>
    <circle cx="570" cy="175" r="4" fill="#00897b"/>
    <text x="585" y="180" font-size="11" fill="#37474f">Ejecuta comandos puntuales o consulta estado</text>
    <circle cx="570" cy="200" r="4" fill="#00897b"/>
    <text x="585" y="205" font-size="11" fill="#37474f">Ejemplos: WinRM, WMI, SNMP, APIs REST</text>
    <circle cx="570" cy="225" r="4" fill="#00897b"/>
    <text x="585" y="230" font-size="11" fill="#37474f">Ideal para gestión de muchos equipos a la vez</text>
    <circle cx="570" cy="250" r="4" fill="#00897b"/>
    <text x="585" y="255" font-size="11" fill="#37474f">Uso típico: Ansible, Windows Admin Center</text>
    <circle cx="570" cy="275" r="4" fill="#00897b"/>
    <text x="585" y="280" font-size="11" fill="#37474f">Menor consumo de recursos por conexión</text>
  </g>

  <text x="500" y="328" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Criterio b) del RA4: diferenciar servicios orientados a sesión de los que no lo están</text>
</svg>
