<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#37474f">Protocolos de acceso remoto y sus puertos</text>

  <!-- SSH -->
  <g>
    <rect x="30" y="80" width="210" height="180" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="135" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#00897b">SSH</text>
    <text x="135" y="134" text-anchor="middle" font-size="12" fill="#37474f">Puerto 22/TCP</text>
    <text x="135" y="156" text-anchor="middle" font-size="11" fill="#37474f">Shell cifrada</text>
    <text x="135" y="174" text-anchor="middle" font-size="11" fill="#37474f">Túneles / SCP</text>
    <text x="135" y="192" text-anchor="middle" font-size="11" fill="#37474f">GNU/Linux y</text>
    <text x="135" y="208" text-anchor="middle" font-size="11" fill="#37474f">Windows (OpenSSH)</text>
    <text x="135" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#00897b">Orientado a sesión</text>
  </g>

  <!-- RDP -->
  <g>
    <rect x="265" y="80" width="210" height="180" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="370" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#5e35b1">RDP</text>
    <text x="370" y="134" text-anchor="middle" font-size="12" fill="#37474f">Puerto 3389/TCP</text>
    <text x="370" y="156" text-anchor="middle" font-size="11" fill="#37474f">Escritorio remoto</text>
    <text x="370" y="174" text-anchor="middle" font-size="11" fill="#37474f">gráfico completo</text>
    <text x="370" y="192" text-anchor="middle" font-size="11" fill="#37474f">Windows Server</text>
    <text x="370" y="208" text-anchor="middle" font-size="11" fill="#37474f">(rol RDS)</text>
    <text x="370" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#5e35b1">Orientado a sesión</text>
  </g>

  <!-- VNC -->
  <g>
    <rect x="500" y="80" width="210" height="180" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="605" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#00897b">VNC</text>
    <text x="605" y="134" text-anchor="middle" font-size="12" fill="#37474f">Puerto 5900/TCP</text>
    <text x="605" y="156" text-anchor="middle" font-size="11" fill="#37474f">Escritorio gráfico</text>
    <text x="605" y="174" text-anchor="middle" font-size="11" fill="#37474f">multiplataforma</text>
    <text x="605" y="192" text-anchor="middle" font-size="11" fill="#37474f">TightVNC, RealVNC,</text>
    <text x="605" y="208" text-anchor="middle" font-size="11" fill="#37474f">UltraVNC</text>
    <text x="605" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#00897b">Orientado a sesión</text>
  </g>

  <!-- WinRM -->
  <g>
    <rect x="735" y="80" width="235" height="180" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="852" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#5e35b1">WinRM</text>
    <text x="852" y="134" text-anchor="middle" font-size="12" fill="#37474f">Puertos 5985 (HTTP) /</text>
    <text x="852" y="150" text-anchor="middle" font-size="12" fill="#37474f">5986 (HTTPS)</text>
    <text x="852" y="172" text-anchor="middle" font-size="11" fill="#37474f">Gestión remota sin sesión</text>
    <text x="852" y="190" text-anchor="middle" font-size="11" fill="#37474f">PowerShell Remoting,</text>
    <text x="852" y="206" text-anchor="middle" font-size="11" fill="#37474f">Windows Admin Center</text>
    <text x="852" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#5e35b1">No orientado a sesión</text>
  </g>

  <text x="500" y="290" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">UT4 · Administración remota — cada protocolo exige reglas de firewall y cifrado propios</text>
</svg>
