<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="300" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#37474f">Túnel SSH: acceso a un puerto remoto no expuesto</text>

  <!-- Cliente -->
  <g>
    <rect x="30" y="90" width="160" height="130" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="110" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Cliente Windows</text>
    <text x="110" y="145" text-anchor="middle" font-size="11" fill="#37474f">PuTTY / OpenSSH</text>
    <text x="110" y="165" text-anchor="middle" font-size="11" fill="#37474f">localhost:3306</text>
    <text x="110" y="185" text-anchor="middle" font-size="11" fill="#37474f">(puerto local)</text>
  </g>

  <path d="M190 155 L305 155" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>
  <text x="247" y="140" text-anchor="middle" font-size="10" fill="#607d8b">SSH cifrado</text>
  <text x="247" y="175" text-anchor="middle" font-size="10" fill="#607d8b">puerto 22</text>

  <!-- Tunel (rectangulo largo) -->
  <g>
    <rect x="310" y="120" width="380" height="70" rx="30" fill="none" stroke="#00897b" stroke-width="3" stroke-dasharray="8,6"/>
    <text x="500" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">Túnel SSH (encapsulado y cifrado)</text>
  </g>

  <path d="M690 155 L805 155" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>
  <text x="747" y="140" text-anchor="middle" font-size="10" fill="#607d8b">tráfico</text>
  <text x="747" y="175" text-anchor="middle" font-size="10" fill="#607d8b">reenviado</text>

  <!-- Servidor -->
  <g>
    <rect x="810" y="90" width="160" height="130" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="890" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">Servidor Linux</text>
    <text x="890" y="138" text-anchor="middle" font-size="11" fill="#37474f">sshd :22</text>
    <text x="890" y="158" text-anchor="middle" font-size="11" fill="#37474f">MySQL :5252</text>
    <text x="890" y="178" text-anchor="middle" font-size="11" fill="#37474f">(sin exponer</text>
    <text x="890" y="196" text-anchor="middle" font-size="11" fill="#37474f">a Internet)</text>
  </g>

  <text x="500" y="260" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Reenvío local: ssh -L 3306:localhost:5252 usuario@servidor — el servicio remoto parece local</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
