<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="340" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#37474f">Arquitectura de una VPN WireGuard</text>

  <!-- Cliente movil -->
  <g>
    <rect x="30" y="90" width="170" height="110" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="115" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Cliente móvil</text>
    <text x="115" y="142" text-anchor="middle" font-size="11" fill="#37474f">Android / iOS</text>
    <text x="115" y="162" text-anchor="middle" font-size="11" fill="#37474f">Peer: 10.0.0.2/32</text>
    <text x="115" y="182" text-anchor="middle" font-size="11" fill="#37474f">Config vía QR</text>
  </g>

  <!-- Cliente desktop -->
  <g>
    <rect x="30" y="215" width="170" height="100" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="115" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Cliente Desktop</text>
    <text x="115" y="265" text-anchor="middle" font-size="11" fill="#37474f">Ubuntu (NAT)</text>
    <text x="115" y="285" text-anchor="middle" font-size="11" fill="#37474f">Peer: 10.0.0.3/32</text>
  </g>

  <path d="M200 145 L330 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow3)"/>
  <path d="M200 265 L330 185" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow3)"/>
  <text x="255" y="130" text-anchor="middle" font-size="10" fill="#607d8b">UDP cifrado</text>
  <text x="255" y="300" text-anchor="middle" font-size="10" fill="#607d8b">ChaCha20</text>

  <!-- Servidor WireGuard -->
  <g>
    <rect x="335" y="120" width="230" height="140" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="450" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Servidor WireGuard</text>
    <text x="450" y="172" text-anchor="middle" font-size="11" fill="#37474f">Contenedor LXC (Proxmox)</text>
    <text x="450" y="192" text-anchor="middle" font-size="11" fill="#37474f">Interfaz wg0: 10.0.0.1/24</text>
    <text x="450" y="212" text-anchor="middle" font-size="11" fill="#37474f">Puerto 51820/UDP</text>
    <text x="450" y="232" text-anchor="middle" font-size="11" fill="#37474f">wg show / WireGuard-UI</text>
  </g>

  <path d="M565 190 L680 190" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow3)"/>

  <!-- Red interna -->
  <g>
    <rect x="685" y="120" width="285" height="140" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="827" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Red interna protegida</text>
    <text x="827" y="172" text-anchor="middle" font-size="11" fill="#37474f">Servidores de administración</text>
    <text x="827" y="192" text-anchor="middle" font-size="11" fill="#37474f">Recursos compartidos</text>
    <text x="827" y="212" text-anchor="middle" font-size="11" fill="#37474f">Solo accesibles a través</text>
    <text x="827" y="230" text-anchor="middle" font-size="11" fill="#37474f">del túnel VPN</text>
  </g>

  <text x="500" y="322" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Cada peer tiene su propio par de claves pública/privada; el servidor solo acepta tráfico de peers autorizados</text>

  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
