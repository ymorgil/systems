<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="300" rx="18" fill="#f7f6fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Arquitectura interna de CUPS</text>

  <!-- Clientes -->
  <g>
    <rect x="30" y="80" width="150" height="140" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="105" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Clientes</text>
    <text x="105" y="135" text-anchor="middle" font-size="11" fill="#37474f">lp / lpr</text>
    <text x="105" y="153" text-anchor="middle" font-size="11" fill="#37474f">Navegador :631</text>
    <text x="105" y="171" text-anchor="middle" font-size="11" fill="#37474f">cups-lpd</text>
    <text x="105" y="189" text-anchor="middle" font-size="11" fill="#37474f">(clientes LPD)</text>
  </g>

  <path d="M180 150 L222 150" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- cupsd scheduler -->
  <g>
    <rect x="227" y="70" width="200" height="160" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="327" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">cupsd (scheduler)</text>
    <text x="327" y="125" text-anchor="middle" font-size="11" fill="#37474f">Protocolo IPP</text>
    <text x="327" y="143" text-anchor="middle" font-size="11" fill="#37474f">/etc/cups/cupsd.conf</text>
    <text x="327" y="161" text-anchor="middle" font-size="11" fill="#37474f">Fichero datos + control</text>
    <text x="327" y="179" text-anchor="middle" font-size="11" fill="#37474f">/var/spool/cups</text>
    <text x="327" y="200" text-anchor="middle" font-size="11" fill="#00897b" font-weight="700">Interfaz web :631</text>
  </g>

  <path d="M427 150 L469 150" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- Filtros -->
  <g>
    <rect x="474" y="80" width="160" height="140" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="554" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Filtros</text>
    <text x="554" y="135" text-anchor="middle" font-size="11" fill="#37474f">Ghostscript</text>
    <text x="554" y="153" text-anchor="middle" font-size="11" fill="#37474f">PostScript → PDL</text>
    <text x="554" y="171" text-anchor="middle" font-size="11" fill="#37474f">nativo impresora</text>
  </g>

  <path d="M634 150 L676 150" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- Backends -->
  <g>
    <rect x="681" y="80" width="160" height="140" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="761" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">Backends</text>
    <text x="761" y="135" text-anchor="middle" font-size="11" fill="#37474f">usb://</text>
    <text x="761" y="153" text-anchor="middle" font-size="11" fill="#37474f">ipp:// socket://</text>
    <text x="761" y="171" text-anchor="middle" font-size="11" fill="#37474f">smb:// (Samba)</text>
  </g>

  <path d="M841 150 L883 150" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- Impresora -->
  <g>
    <rect x="888" y="90" width="90" height="120" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="933" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Impresora</text>
    <text x="933" y="140" text-anchor="middle" font-size="11" fill="#37474f">local o</text>
    <text x="933" y="158" text-anchor="middle" font-size="11" fill="#37474f">de red</text>
  </g>

  <text x="500" y="265" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">UT5 · CUPS: del cliente IPP al dispositivo físico, pasando por cola, filtros y backend</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
