<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Del cliente al papel: el ciclo de vida de un trabajo de impresión</text>

  <!-- Cliente -->
  <g>
    <rect x="30" y="90" width="140" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="100" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Cliente</text>
    <text x="100" y="155" text-anchor="middle" font-size="11" fill="#37474f">Aplicación</text>
    <text x="100" y="175" text-anchor="middle" font-size="11" fill="#37474f">Controlador</text>
    <text x="100" y="195" text-anchor="middle" font-size="11" fill="#37474f">IPP / LPR /</text>
    <text x="100" y="212" text-anchor="middle" font-size="11" fill="#37474f">SMB / AppSocket</text>
  </g>

  <path d="M170 165 L215 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Cola / spooler -->
  <g>
    <rect x="220" y="90" width="150" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="295" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Cola / spooler</text>
    <text x="295" y="155" text-anchor="middle" font-size="11" fill="#37474f">Fichero de datos</text>
    <text x="295" y="175" text-anchor="middle" font-size="11" fill="#37474f">Fichero de control</text>
    <text x="295" y="195" text-anchor="middle" font-size="11" fill="#37474f">Prioridad y</text>
    <text x="295" y="212" text-anchor="middle" font-size="11" fill="#37474f">portadas</text>
  </g>

  <path d="M370 165 L415 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Servidor de impresion -->
  <g>
    <rect x="420" y="80" width="190" height="170" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="515" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Servidor de impresión</text>
    <text x="515" y="134" text-anchor="middle" font-size="11" fill="#37474f">Windows Print Server</text>
    <text x="515" y="152" text-anchor="middle" font-size="11" fill="#37474f">CUPS (cupsd)</text>
    <text x="515" y="170" text-anchor="middle" font-size="11" fill="#37474f">Filtros / Ghostscript</text>
    <text x="515" y="188" text-anchor="middle" font-size="11" fill="#37474f">Backends (USB, IPP,</text>
    <text x="515" y="204" text-anchor="middle" font-size="11" fill="#37474f">AppSocket, Samba)</text>
    <text x="515" y="228" text-anchor="middle" font-size="11" fill="#00897b" font-weight="700">puerto 631 / 515 / 9100</text>
  </g>

  <path d="M610 165 L655 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Impresora logica -->
  <g>
    <rect x="660" y="90" width="150" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="735" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Impresora lógica</text>
    <text x="735" y="155" text-anchor="middle" font-size="11" fill="#37474f">Grupo / clase</text>
    <text x="735" y="175" text-anchor="middle" font-size="11" fill="#37474f">Permisos ACL</text>
    <text x="735" y="195" text-anchor="middle" font-size="11" fill="#37474f">Cuotas y</text>
    <text x="735" y="212" text-anchor="middle" font-size="11" fill="#37474f">prioridades</text>
  </g>

  <path d="M810 165 L855 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Impresora fisica -->
  <g>
    <rect x="860" y="90" width="110" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="915" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Impresora</text>
    <text x="915" y="150" text-anchor="middle" font-size="11" fill="#5e35b1">física</text>
    <text x="915" y="175" text-anchor="middle" font-size="11" fill="#37474f">Local / red</text>
    <text x="915" y="195" text-anchor="middle" font-size="11" fill="#37474f">USB / RJ45</text>
    <text x="915" y="213" text-anchor="middle" font-size="11" fill="#37474f">WiFi</text>
  </g>

  <text x="500" y="290" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">UT5 · Servidores de impresión: del trabajo del cliente al papel impreso</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
