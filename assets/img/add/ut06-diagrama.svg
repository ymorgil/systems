<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Escenario heterogéneo: compartición de recursos entre Windows y Linux</text>

  <!-- Cliente Windows -->
  <g>
    <rect x="30" y="90" width="150" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="105" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Cliente Windows</text>
    <text x="105" y="155" text-anchor="middle" font-size="11" fill="#37474f">Explorador de archivos</text>
    <text x="105" y="175" text-anchor="middle" font-size="11" fill="#37474f">\\servidor\recurso</text>
    <text x="105" y="200" text-anchor="middle" font-size="11" fill="#37474f">Unidad de red (T:)</text>
    <text x="105" y="220" text-anchor="middle" font-size="11" fill="#37474f">Cliente NFS nativo</text>
  </g>

  <path d="M180 165 L225 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M225 195 L180 195" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Servidor Samba/NFS -->
  <g>
    <rect x="230" y="70" width="220" height="190" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="340" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Servidor Linux</text>
    <text x="340" y="122" text-anchor="middle" font-size="11" fill="#37474f">smbd / nmbd (Samba)</text>
    <text x="340" y="140" text-anchor="middle" font-size="11" fill="#37474f">SMB/CIFS · puerto 445</text>
    <rect x="255" y="150" width="170" height="1" fill="#b2dfdb"/>
    <text x="340" y="168" text-anchor="middle" font-size="11" fill="#37474f">nfs-kernel-server</text>
    <text x="340" y="186" text-anchor="middle" font-size="11" fill="#37474f">/etc/exports · NFSv4</text>
    <text x="340" y="210" text-anchor="middle" font-size="11" fill="#37474f">Niveles de acceso:</text>
    <text x="340" y="228" text-anchor="middle" font-size="11" fill="#37474f">completo / restringido (@grupo)</text>
    <text x="340" y="246" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">172.29.xx.5</text>
  </g>

  <path d="M450 165 L495 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M495 195 L450 195" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Cliente Linux -->
  <g>
    <rect x="500" y="90" width="150" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="575" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Cliente Linux</text>
    <text x="575" y="155" text-anchor="middle" font-size="11" fill="#37474f">mount -t nfs</text>
    <text x="575" y="175" text-anchor="middle" font-size="11" fill="#37474f">mount -t cifs</text>
    <text x="575" y="200" text-anchor="middle" font-size="11" fill="#37474f">smbclient</text>
    <text x="575" y="220" text-anchor="middle" font-size="11" fill="#37474f">/etc/fstab</text>
  </g>

  <path d="M650 165 L695 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Contenedores -->
  <g>
    <rect x="700" y="80" width="140" height="170" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="770" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Docker</text>
    <rect x="715" y="122" width="45" height="30" rx="4" fill="#00897b"/>
    <text x="737" y="142" text-anchor="middle" font-size="9" fill="#fff">web</text>
    <rect x="765" y="122" width="45" height="30" rx="4" fill="#00897b"/>
    <text x="787" y="142" text-anchor="middle" font-size="9" fill="#fff">bd</text>
    <text x="770" y="175" text-anchor="middle" font-size="11" fill="#37474f">Volúmenes</text>
    <text x="770" y="193" text-anchor="middle" font-size="11" fill="#37474f">Redes bridge</text>
    <text x="770" y="211" text-anchor="middle" font-size="11" fill="#37474f">Kubernetes</text>
    <text x="770" y="229" text-anchor="middle" font-size="11" fill="#37474f">(orquestación)</text>
  </g>

  <path d="M840 165 L885 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Clúster/NAS -->
  <g>
    <rect x="890" y="80" width="90" height="170" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="935" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Clúster</text>
    <ellipse cx="935" cy="150" rx="35" ry="14" fill="#5e35b1"/>
    <rect x="900" y="150" width="70" height="24" fill="#5e35b1"/>
    <ellipse cx="935" cy="174" rx="35" ry="14" fill="#5e35b1"/>
    <text x="935" y="156" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">NAS/SAN</text>
    <text x="935" y="205" text-anchor="middle" font-size="10" fill="#37474f">Failover</text>
    <text x="935" y="221" text-anchor="middle" font-size="10" fill="#37474f">Quórum</text>
  </g>

  <text x="500" y="290" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">UT6 · Integración de sistemas operativos libres y propietarios</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
