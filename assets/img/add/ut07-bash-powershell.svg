<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="300" rx="18" fill="#f7f6fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Dos lenguajes de guiones, un mismo objetivo: administrar el sistema</text>

  <!-- Bash -->
  <g>
    <rect x="60" y="70" width="380" height="190" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="250" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#5e35b1">Bash (libre)</text>
    <text x="90" y="128" font-size="12" fill="#37474f">- Intérprete /bin/bash, extensión .sh</text>
    <text x="90" y="150" font-size="12" fill="#37474f">- useradd / usermod / userdel</text>
    <text x="90" y="172" font-size="12" fill="#37474f">- systemctl, ps, kill, nice</text>
    <text x="90" y="194" font-size="12" fill="#37474f">- Depuración: bash -n, bash -x, set -e</text>
    <text x="90" y="216" font-size="12" fill="#37474f">- Planificación: cron / at</text>
    <text x="90" y="238" font-size="12" fill="#37474f">- Librerías: source ./funciones.sh</text>
  </g>

  <!-- PowerShell -->
  <g>
    <rect x="560" y="70" width="380" height="190" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="750" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#00897b">PowerShell (propietario)</text>
    <text x="590" y="128" font-size="12" fill="#37474f">- Motor .NET, extensión .ps1</text>
    <text x="590" y="150" font-size="12" fill="#37474f">- New-ADUser / Set-ADUser / Remove-ADUser</text>
    <text x="590" y="172" font-size="12" fill="#37474f">- Get-Service, Start/Stop/Restart-Service</text>
    <text x="590" y="194" font-size="12" fill="#37474f">- Depuración: breakpoints en ISE / VS Code</text>
    <text x="590" y="216" font-size="12" fill="#37474f">- Planificación: Programador de tareas</text>
    <text x="590" y="238" font-size="12" fill="#37474f">- Librerías: Import-Module ./funciones.psm1</text>
  </g>

  <!-- Centro comun -->
  <circle cx="500" cy="165" r="42" fill="#37474f"/>
  <text x="500" y="160" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Guiones de</text>
  <text x="500" y="175" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">administración</text>

  <path d="M440 165 L458 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>
  <path d="M560 165 L542 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>

  <text x="500" y="284" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Mismo criterio de evaluación (g): guiones implantados en sistemas libres y propietarios</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
