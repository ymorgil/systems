<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Ciclo de vida de un script de administración de sistemas</text>

  <!-- Escritura -->
  <g>
    <rect x="20" y="90" width="150" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="95" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">1. Escritura</text>
    <text x="95" y="150" text-anchor="middle" font-size="11" fill="#37474f">Interpretar guiones</text>
    <text x="95" y="168" text-anchor="middle" font-size="11" fill="#37474f">del sistema</text>
    <text x="95" y="190" text-anchor="middle" font-size="11" fill="#37474f">Bash / PowerShell</text>
    <text x="95" y="210" text-anchor="middle" font-size="11" fill="#37474f">Librerías y funciones</text>
  </g>

  <path d="M170 165 L207 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Depuración -->
  <g>
    <rect x="212" y="90" width="150" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="287" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">2. Depuración</text>
    <text x="287" y="150" text-anchor="middle" font-size="11" fill="#37474f">bash -n / bash -x</text>
    <text x="287" y="168" text-anchor="middle" font-size="11" fill="#37474f">set -e / set -u</text>
    <text x="287" y="190" text-anchor="middle" font-size="11" fill="#37474f">Breakpoints ISE /</text>
    <text x="287" y="208" text-anchor="middle" font-size="11" fill="#37474f">VS Code</text>
  </g>

  <path d="M362 165 L399 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Prueba -->
  <g>
    <rect x="404" y="80" width="170" height="170" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="489" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">3. Prueba</text>
    <text x="489" y="136" text-anchor="middle" font-size="11" fill="#37474f">Cuentas de usuario</text>
    <text x="489" y="154" text-anchor="middle" font-size="11" fill="#37474f">Procesos y servicios</text>
    <text x="489" y="172" text-anchor="middle" font-size="11" fill="#37474f">Códigos de retorno</text>
    <text x="489" y="190" text-anchor="middle" font-size="11" fill="#37474f">Casos límite</text>
    <text x="489" y="212" text-anchor="middle" font-size="11" fill="#37474f">($#, ficheros vacíos)</text>
  </g>

  <path d="M574 165 L611 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Documentacion -->
  <g>
    <rect x="616" y="90" width="150" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="691" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">4. Documentación</text>
    <text x="691" y="150" text-anchor="middle" font-size="11" fill="#37474f">Cabecera y ayuda</text>
    <text x="691" y="168" text-anchor="middle" font-size="11" fill="#37474f">(-h / --help)</text>
    <text x="691" y="190" text-anchor="middle" font-size="11" fill="#37474f">Comentarios y</text>
    <text x="691" y="208" text-anchor="middle" font-size="11" fill="#37474f">control de versiones</text>
  </g>

  <path d="M766 165 L803 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Despliegue -->
  <g>
    <rect x="808" y="90" width="170" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="893" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">5. Despliegue</text>
    <text x="893" y="150" text-anchor="middle" font-size="11" fill="#37474f">Planificación (cron /</text>
    <text x="893" y="168" text-anchor="middle" font-size="11" fill="#37474f">Programador de tareas)</text>
    <text x="893" y="190" text-anchor="middle" font-size="11" fill="#37474f">Libre y propietario</text>
    <text x="893" y="208" text-anchor="middle" font-size="11" fill="#37474f">(Bash / PowerShell)</text>
  </g>

  <path d="M893 240 C 893 280, 95 280, 95 240" stroke="#b0bec5" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrowGris)"/>
  <text x="500" y="300" text-anchor="middle" font-size="11" fill="#607d8b" font-style="italic">El script vuelve a la fase de escritura cuando el sistema o los requisitos cambian</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
    <marker id="arrowGris" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b0bec5"/>
    </marker>
  </defs>
</svg>
