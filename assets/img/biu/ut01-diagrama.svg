<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">De los datos en bruto a la decisión: el ciclo de vida del dato</text>

  <!-- Fuentes -->
  <g>
    <rect x="30" y="90" width="140" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="100" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Fuentes</text>
    <text x="100" y="155" text-anchor="middle" font-size="11" fill="#37474f">Sensores IoT</text>
    <text x="100" y="175" text-anchor="middle" font-size="11" fill="#37474f">Apps / logs</text>
    <text x="100" y="195" text-anchor="middle" font-size="11" fill="#37474f">Redes sociales</text>
    <text x="100" y="215" text-anchor="middle" font-size="11" fill="#37474f">BBDD OLTP</text>
  </g>

  <path d="M170 165 L215 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Ingesta -->
  <g>
    <rect x="220" y="90" width="140" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="290" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Ingestión</text>
    <text x="290" y="155" text-anchor="middle" font-size="11" fill="#37474f">Batch (ETL)</text>
    <text x="290" y="175" text-anchor="middle" font-size="11" fill="#37474f">Streaming</text>
    <text x="290" y="195" text-anchor="middle" font-size="11" fill="#37474f">Formato: CSV,</text>
    <text x="290" y="212" text-anchor="middle" font-size="11" fill="#37474f">JSON, Parquet</text>
  </g>

  <path d="M360 165 L405 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Almacenamiento (Cloud) -->
  <g>
    <rect x="410" y="80" width="180" height="170" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="500" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Almacenamiento</text>
    <text x="500" y="132" text-anchor="middle" font-size="11" fill="#37474f">Data Lake (S3 / HDFS)</text>
    <ellipse cx="500" cy="175" rx="55" ry="18" fill="#5e35b1"/>
    <rect x="445" y="175" width="110" height="30" fill="#5e35b1"/>
    <ellipse cx="500" cy="205" rx="55" ry="18" fill="#5e35b1"/>
    <text x="500" y="182" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">CLOUD</text>
    <text x="500" y="235" text-anchor="middle" font-size="11" fill="#37474f">Data Warehouse</text>
  </g>

  <path d="M590 165 L635 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Procesamiento -->
  <g>
    <rect x="640" y="90" width="150" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="715" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Procesamiento</text>
    <text x="715" y="155" text-anchor="middle" font-size="11" fill="#37474f">Spark / MapReduce</text>
    <text x="715" y="175" text-anchor="middle" font-size="11" fill="#37474f">Limpieza</text>
    <text x="715" y="195" text-anchor="middle" font-size="11" fill="#37474f">Transformación</text>
    <text x="715" y="215" text-anchor="middle" font-size="11" fill="#37474f">Agregación</text>
  </g>

  <path d="M790 165 L835 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Analitica -->
  <g>
    <rect x="840" y="90" width="130" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="905" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Analítica</text>
    <text x="905" y="155" text-anchor="middle" font-size="11" fill="#37474f">Dashboards</text>
    <text x="905" y="175" text-anchor="middle" font-size="11" fill="#37474f">Informes</text>
    <text x="905" y="195" text-anchor="middle" font-size="11" fill="#37474f">Modelos ML</text>
    <text x="905" y="215" text-anchor="middle" font-size="11" fill="#37474f">Decisiones</text>
  </g>

  <text x="500" y="290" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">UT1 · Gestión de soluciones con sistemas de almacenamiento y herramientas del centro de datos</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
