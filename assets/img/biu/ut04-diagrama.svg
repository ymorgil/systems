<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Monitorización de un clúster Big Data</text>

  <!-- Nodos -->
  <g>
    <rect x="50" y="80" width="110" height="70" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="105" y="120" text-anchor="middle" font-size="12" fill="#5e35b1" font-weight="700">NameNode</text>
    <rect x="50" y="170" width="110" height="60" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="105" y="205" text-anchor="middle" font-size="12" fill="#00897b" font-weight="700">DataNode 1</text>
    <rect x="50" y="240" width="110" height="60" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="105" y="275" text-anchor="middle" font-size="12" fill="#00897b" font-weight="700">DataNode 2</text>
  </g>

  <path d="M165 115 L260 140" stroke="#90a4ae" stroke-width="2"/>
  <path d="M165 200 L260 150" stroke="#90a4ae" stroke-width="2"/>
  <path d="M165 270 L260 165" stroke="#90a4ae" stroke-width="2"/>

  <!-- Exporters / métricas -->
  <g>
    <rect x="265" y="120" width="150" height="60" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="340" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#f9a825">Métricas</text>
    <text x="340" y="163" text-anchor="middle" font-size="11" fill="#37474f">CPU · RAM · I/O · Jobs</text>
  </g>

  <path d="M415 150 L465 150" stroke="#90a4ae" stroke-width="3" marker-end="url(#a4)"/>

  <!-- Prometheus -->
  <g>
    <rect x="470" y="100" width="160" height="100" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="550" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Prometheus</text>
    <text x="550" y="155" text-anchor="middle" font-size="11" fill="#37474f">(recolección series</text>
    <text x="550" y="172" text-anchor="middle" font-size="11" fill="#37474f">temporales + alertas)</text>
  </g>

  <path d="M630 150 L680 150" stroke="#90a4ae" stroke-width="3" marker-end="url(#a4)"/>

  <!-- Grafana -->
  <g>
    <rect x="685" y="95" width="180" height="110" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="775" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">Grafana</text>
    <rect x="705" y="140" width="60" height="45" fill="#00897b" opacity="0.7"/>
    <rect x="775" y="150" width="60" height="35" fill="#5e35b1" opacity="0.7"/>
    <rect x="705" y="140" width="60" height="10" fill="#e0f2f1"/>
    <text x="775" y="192" text-anchor="middle" font-size="10" fill="#37474f">dashboards + alertas</text>
  </g>

  <text x="500" y="240" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Interfaces web nativas: NameNode (:9870) · YARN ResourceManager (:8088)</text>
  <text x="500" y="260" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Ganglia ⚠ prácticamente en desuso hoy → Prometheus + Grafana (estándar actual)</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
