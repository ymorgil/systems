<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="260" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Proceso KDD (Knowledge Discovery in Databases)</text>

  <g>
    <rect x="30" y="80" width="150" height="80" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="105" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">1. Selección</text>
    <text x="105" y="135" text-anchor="middle" font-size="10" fill="#37474f">datos relevantes</text>
  </g>
  <path d="M180 120 L215 120" stroke="#90a4ae" stroke-width="3" marker-end="url(#a5)"/>

  <g>
    <rect x="220" y="80" width="150" height="80" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="295" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">2. Limpieza</text>
    <text x="295" y="135" text-anchor="middle" font-size="10" fill="#37474f">nulos, duplicados</text>
  </g>
  <path d="M370 120 L405 120" stroke="#90a4ae" stroke-width="3" marker-end="url(#a5)"/>

  <g>
    <rect x="410" y="80" width="150" height="80" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="485" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">3. Transformación</text>
    <text x="485" y="135" text-anchor="middle" font-size="10" fill="#37474f">normalización</text>
  </g>
  <path d="M560 120 L595 120" stroke="#90a4ae" stroke-width="3" marker-end="url(#a5)"/>

  <g>
    <rect x="600" y="80" width="150" height="80" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="675" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">4. Minería de datos</text>
    <text x="675" y="135" text-anchor="middle" font-size="10" fill="#37474f">patrones, modelos</text>
  </g>
  <path d="M750 120 L785 120" stroke="#90a4ae" stroke-width="3" marker-end="url(#a5)"/>

  <g>
    <rect x="790" y="80" width="180" height="80" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="880" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">5. Interpretación</text>
    <text x="880" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">y evaluación</text>
    <text x="880" y="144" text-anchor="middle" font-size="10" fill="#37474f">decisión de negocio</text>
  </g>

  <path d="M880 40 C 880 -10, 105 -10, 105 75" stroke="#b39ddb" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#a5)" transform="translate(0,20)"/>
  <text x="500" y="215" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Proceso iterativo: la evaluación retroalimenta nuevas hipótesis y ciclos de análisis</text>

  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
