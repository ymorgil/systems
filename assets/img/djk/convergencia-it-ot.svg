<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="340" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#37474f">Convergencia de entornos IT y OT</text>

  <!-- IT -->
  <g>
    <rect x="40" y="70" width="270" height="220" rx="16" fill="#ede7f6" stroke="#5e35b1" stroke-width="2.5"/>
    <text x="175" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#5e35b1">IT · Information Technology</text>
    <text x="175" y="122" text-anchor="middle" font-size="11" fill="#37474f">Gestión de datos, redes</text>
    <text x="175" y="139" text-anchor="middle" font-size="11" fill="#37474f">y procesos de información</text>

    <rect x="60" y="152" width="110" height="34" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="115" y="173" text-anchor="middle" font-size="10" fill="#37474f">Servidores</text>

    <rect x="180" y="152" width="110" height="34" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="235" y="173" text-anchor="middle" font-size="10" fill="#37474f">Bases de datos</text>

    <rect x="60" y="192" width="110" height="34" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="115" y="213" text-anchor="middle" font-size="10" fill="#37474f">ERP / CRM</text>

    <rect x="180" y="192" width="110" height="34" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="235" y="213" text-anchor="middle" font-size="10" fill="#37474f">Software</text>

    <text x="175" y="250" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">Departamentos IT: soporte,</text>
    <text x="175" y="266" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">ciberseguridad, desarrollo...</text>
  </g>

  <path d="M310 180 L365 180" stroke="#00897b" stroke-width="4" marker-end="url(#arrowg)"/>
  <path d="M365 210 L310 210" stroke="#5e35b1" stroke-width="4" marker-end="url(#arrowp)"/>

  <!-- Convergencia -->
  <g>
    <rect x="370" y="110" width="260" height="140" rx="16" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
    <text x="500" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#8d6e00">Convergencia IT/OT</text>
    <text x="500" y="165" text-anchor="middle" font-size="10" fill="#37474f">Eficiencia operativa</text>
    <text x="500" y="183" text-anchor="middle" font-size="10" fill="#37474f">Decisiones en tiempo real</text>
    <text x="500" y="201" text-anchor="middle" font-size="10" fill="#37474f">Mayor seguridad</text>
    <text x="500" y="219" text-anchor="middle" font-size="10" fill="#37474f">Predicción de fallos</text>
  </g>

  <path d="M630 180 L685 180" stroke="#5e35b1" stroke-width="4" marker-end="url(#arrowp)"/>
  <path d="M685 210 L630 210" stroke="#00897b" stroke-width="4" marker-end="url(#arrowg)"/>

  <!-- OT -->
  <g>
    <rect x="690" y="70" width="270" height="220" rx="16" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/>
    <text x="825" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#00897b">OT · Operation Technology</text>
    <text x="825" y="122" text-anchor="middle" font-size="11" fill="#37474f">Supervisión y control de</text>
    <text x="825" y="139" text-anchor="middle" font-size="11" fill="#37474f">sistemas físicos industriales</text>

    <rect x="710" y="152" width="110" height="34" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="765" y="173" text-anchor="middle" font-size="10" fill="#37474f">Sensores IoT</text>

    <rect x="830" y="152" width="110" height="34" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="885" y="173" text-anchor="middle" font-size="10" fill="#37474f">PLC / SCADA</text>

    <rect x="710" y="192" width="110" height="34" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="765" y="213" text-anchor="middle" font-size="10" fill="#37474f">Robótica</text>

    <rect x="830" y="192" width="110" height="34" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="885" y="213" text-anchor="middle" font-size="10" fill="#37474f">Mantenimiento</text>

    <text x="825" y="250" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">Tradicionalmente sistemas</text>
    <text x="825" y="266" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">cerrados y aislados</text>
  </g>

  <text x="500" y="315" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">La convergencia IT/OT conecta el dato de negocio con el dato de planta en tiempo real</text>

  <defs>
    <marker id="arrowp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5e35b1"/>
    </marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00897b"/>
    </marker>
  </defs>
</svg>
