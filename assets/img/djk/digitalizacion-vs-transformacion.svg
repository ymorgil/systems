<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#37474f">Digitalización vs Transformación digital</text>

  <!-- Digitalización -->
  <g>
    <rect x="40" y="70" width="260" height="200" rx="16" fill="#ede7f6" stroke="#5e35b1" stroke-width="2.5"/>
    <text x="170" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#5e35b1">Digitalización</text>
    <text x="170" y="128" text-anchor="middle" font-size="11" fill="#37474f">Convertir información</text>
    <text x="170" y="146" text-anchor="middle" font-size="11" fill="#37474f">física en digital</text>

    <rect x="60" y="160" width="90" height="34" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="105" y="181" text-anchor="middle" font-size="10" fill="#37474f">Papel → PDF</text>

    <rect x="160" y="160" width="90" height="34" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="205" y="181" text-anchor="middle" font-size="10" fill="#37474f">Ficha → BBDD</text>

    <text x="170" y="220" text-anchor="middle" font-size="11" fill="#37474f">Cambio puntual,</text>
    <text x="170" y="238" text-anchor="middle" font-size="11" fill="#37474f">de formato del dato</text>
    <text x="170" y="258" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">Es el punto de partida</text>
  </g>

  <path d="M300 170 L345 170" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="322" y="158" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">habilita</text>

  <!-- Transformación digital -->
  <g>
    <rect x="350" y="60" width="300" height="220" rx="16" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/>
    <text x="500" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#00897b">Transformación digital</text>
    <text x="500" y="115" text-anchor="middle" font-size="11" fill="#37474f">Cambio estructural: tecnología</text>
    <text x="500" y="132" text-anchor="middle" font-size="11" fill="#37474f">integrada en todos los procesos</text>

    <rect x="370" y="148" width="120" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="430" y="167" text-anchor="middle" font-size="10" fill="#37474f">Procesos</text>
    <text x="430" y="181" text-anchor="middle" font-size="10" fill="#37474f">rediseñados</text>

    <rect x="500" y="148" width="130" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="565" y="167" text-anchor="middle" font-size="10" fill="#37474f">Cultura y modelo</text>
    <text x="565" y="181" text-anchor="middle" font-size="10" fill="#37474f">de negocio</text>

    <text x="500" y="215" text-anchor="middle" font-size="11" fill="#37474f">Ej.: retail omnicanal con IA</text>
    <text x="500" y="233" text-anchor="middle" font-size="11" fill="#37474f">que personaliza la experiencia</text>
    <text x="500" y="251" text-anchor="middle" font-size="11" fill="#37474f">de cada cliente</text>
    <text x="500" y="269" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">Afecta a toda la organización</text>
  </g>

  <path d="M660 170 L705 170" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Resultado -->
  <g>
    <rect x="710" y="90" width="260" height="160" rx="16" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="840" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Nuevos modelos</text>
    <text x="840" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">de negocio</text>
    <text x="840" y="165" text-anchor="middle" font-size="11" fill="#37474f">Uber</text>
    <text x="840" y="183" text-anchor="middle" font-size="11" fill="#37474f">Airbnb</text>
    <text x="840" y="201" text-anchor="middle" font-size="11" fill="#37474f">Decisiones basadas</text>
    <text x="840" y="219" text-anchor="middle" font-size="11" fill="#37474f">en datos (Big Data)</text>
  </g>

  <text x="500" y="300" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Digitalizar un dato no es lo mismo que transformar digitalmente una organización</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
