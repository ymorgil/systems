<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="300" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#37474f">Plan Digital: fases de un proyecto de digitalización</text>

  <!-- Fase 1 -->
  <g>
    <rect x="20" y="70" width="150" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="95" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#5e35b1">1</text>
    <text x="95" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Diagnóstico</text>
    <text x="95" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">digital</text>
    <text x="95" y="162" text-anchor="middle" font-size="10" fill="#37474f">Estado actual de</text>
    <text x="95" y="177" text-anchor="middle" font-size="10" fill="#37474f">procesos y sistemas</text>
  </g>

  <path d="M170 145 L207 145" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Fase 2 -->
  <g>
    <rect x="212" y="70" width="150" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="287" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#00897b">2</text>
    <text x="287" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">Definición de</text>
    <text x="287" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">objetivos</text>
    <text x="287" y="162" text-anchor="middle" font-size="10" fill="#37474f">Qué se quiere</text>
    <text x="287" y="177" text-anchor="middle" font-size="10" fill="#37474f">conseguir y cuándo</text>
  </g>

  <path d="M362 145 L399 145" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Fase 3 -->
  <g>
    <rect x="404" y="70" width="150" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="479" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#5e35b1">3</text>
    <text x="479" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Elección de</text>
    <text x="479" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">tecnologías</text>
    <text x="479" y="162" text-anchor="middle" font-size="10" fill="#37474f">ERP, CRM, IoT,</text>
    <text x="479" y="177" text-anchor="middle" font-size="10" fill="#37474f">cloud, Big Data...</text>
  </g>

  <path d="M554 145 L591 145" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Fase 4 -->
  <g>
    <rect x="596" y="70" width="150" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="671" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#00897b">4</text>
    <text x="671" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">Capacitación y</text>
    <text x="671" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">gestión del cambio</text>
    <text x="671" y="162" text-anchor="middle" font-size="10" fill="#37474f">Formación y</text>
    <text x="671" y="177" text-anchor="middle" font-size="10" fill="#37474f">ciberseguridad</text>
  </g>

  <path d="M746 145 L783 145" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Fase 5 -->
  <g>
    <rect x="788" y="70" width="190" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="883" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#5e35b1">5</text>
    <text x="883" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Implementación</text>
    <text x="883" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">y seguimiento</text>
    <text x="883" y="162" text-anchor="middle" font-size="10" fill="#37474f">Despliegue, medición</text>
    <text x="883" y="177" text-anchor="middle" font-size="10" fill="#37474f">de resultados y mejora</text>
  </g>

  <text x="500" y="262" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Un Plan Digital es iterativo: el seguimiento retroalimenta de nuevo el diagnóstico</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
