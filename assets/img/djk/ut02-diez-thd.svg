<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="400" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Las 10 tecnologías habilitadoras digitales (THD) trabajadas en el aula</text>

  <!-- Fila 1 -->
  <g>
    <rect x="30" y="60" width="180" height="80" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="120" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Gemelos digitales</text>
    <text x="120" y="108" text-anchor="middle" font-size="11" fill="#37474f">Robótica colaborativa</text>
  </g>

  <g>
    <rect x="225" y="60" width="180" height="80" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="315" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">Biotecnología</text>
    <text x="315" y="113" text-anchor="middle" font-size="11" fill="#37474f">industrial</text>
  </g>

  <g>
    <rect x="420" y="60" width="180" height="80" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="510" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Realidad aumentada</text>
    <text x="510" y="108" text-anchor="middle" font-size="11" fill="#37474f">Realidad virtual</text>
  </g>

  <g>
    <rect x="615" y="60" width="180" height="80" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="705" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">Redes 5G</text>
    <text x="705" y="108" text-anchor="middle" font-size="11" fill="#37474f">Fotónica</text>
  </g>

  <g>
    <rect x="810" y="60" width="160" height="80" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="890" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Internet de las cosas</text>
    <text x="890" y="108" text-anchor="middle" font-size="11" fill="#37474f">Ciberseguridad IT/OT</text>
  </g>

  <!-- Fila 2 -->
  <g>
    <rect x="30" y="160" width="180" height="80" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="120" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">Inteligencia</text>
    <text x="120" y="218" text-anchor="middle" font-size="11" fill="#37474f">artificial (IA)</text>
  </g>

  <g>
    <rect x="225" y="160" width="180" height="80" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="315" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Big data</text>
    <text x="315" y="218" text-anchor="middle" font-size="11" fill="#37474f">y analítica</text>
  </g>

  <g>
    <rect x="420" y="160" width="180" height="80" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="510" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">Materiales avanzados</text>
    <text x="510" y="208" text-anchor="middle" font-size="11" fill="#37474f">Impresión 3D</text>
  </g>

  <g>
    <rect x="615" y="160" width="180" height="80" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="705" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Computación en la nube</text>
    <text x="705" y="208" text-anchor="middle" font-size="11" fill="#37474f">Blockchain</text>
  </g>

  <g>
    <rect x="810" y="160" width="160" height="80" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="890" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">Nanotecnología</text>
    <text x="890" y="208" text-anchor="middle" font-size="11" fill="#37474f">Micro/nanoelectrónica</text>
  </g>

  <!-- Centro conceptual -->
  <g>
    <rect x="335" y="270" width="330" height="70" rx="16" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
    <text x="500" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#8d6e00">Transformación digital de la empresa</text>
    <text x="500" y="318" text-anchor="middle" font-size="11" fill="#37474f">Productos · Servicios · Procesos · Modelos de negocio</text>
  </g>

  <path d="M120 240 L420 285" stroke="#90a4ae" stroke-width="1.5" fill="none"/>
  <path d="M510 240 L500 270" stroke="#90a4ae" stroke-width="1.5" fill="none"/>
  <path d="M890 240 L580 285" stroke="#90a4ae" stroke-width="1.5" fill="none"/>

  <text x="500" y="375" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Cada grupo del aula investigó y presentó una de estas THD con el modelo de pitch de 10 diapositivas</text>
</svg>
