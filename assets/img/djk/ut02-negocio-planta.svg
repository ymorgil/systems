<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="360" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">THD: implicación en la parte de negocio y en la parte de planta</text>

  <!-- Negocio -->
  <g>
    <rect x="40" y="65" width="420" height="255" rx="16" fill="#ede7f6" stroke="#5e35b1" stroke-width="2.5"/>
    <text x="250" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#5e35b1">Parte de negocio</text>
    <text x="250" y="114" text-anchor="middle" font-size="11" fill="#37474f">estrategia, mercado, cliente, modelo de ingresos</text>

    <rect x="60" y="130" width="180" height="40" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="150" y="154" text-anchor="middle" font-size="11" fill="#37474f">Big data y analítica</text>

    <rect x="250" y="130" width="190" height="40" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="345" y="154" text-anchor="middle" font-size="11" fill="#37474f">IA para decisiones y CRM</text>

    <rect x="60" y="178" width="180" height="40" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="150" y="202" text-anchor="middle" font-size="11" fill="#37474f">Blockchain (contratos)</text>

    <rect x="250" y="178" width="190" height="40" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="345" y="202" text-anchor="middle" font-size="11" fill="#37474f">Cloud (ERP / CRM SaaS)</text>

    <rect x="60" y="226" width="180" height="40" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="150" y="250" text-anchor="middle" font-size="11" fill="#37474f">Realidad virtual (marketing)</text>

    <rect x="250" y="226" width="190" height="40" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="345" y="250" text-anchor="middle" font-size="11" fill="#37474f">Ciberseguridad IT</text>

    <text x="250" y="290" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">Impacto: nuevos productos,</text>
    <text x="250" y="306" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">servicios y canales de venta</text>
  </g>

  <!-- Flecha central -->
  <path d="M465 190 L535 190" stroke="#f9a825" stroke-width="4" marker-end="url(#arrowb)"/>
  <path d="M535 210 L465 210" stroke="#f9a825" stroke-width="4" marker-end="url(#arrowb2)"/>
  <text x="500" y="160" text-anchor="middle" font-size="10" fill="#8d6e00" font-weight="700">datos</text>
  <text x="500" y="235" text-anchor="middle" font-size="10" fill="#8d6e00" font-weight="700">decisiones</text>

  <!-- Planta -->
  <g>
    <rect x="540" y="65" width="420" height="255" rx="16" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/>
    <text x="750" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#00897b">Parte de planta</text>
    <text x="750" y="114" text-anchor="middle" font-size="11" fill="#37474f">producción, maquinaria, operarios, línea de montaje</text>

    <rect x="560" y="130" width="180" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="650" y="154" text-anchor="middle" font-size="11" fill="#37474f">Robótica colaborativa</text>

    <rect x="750" y="130" width="190" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="845" y="154" text-anchor="middle" font-size="11" fill="#37474f">Gemelos digitales</text>

    <rect x="560" y="178" width="180" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="650" y="202" text-anchor="middle" font-size="11" fill="#37474f">IoT y sensores 5G</text>

    <rect x="750" y="178" width="190" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="845" y="202" text-anchor="middle" font-size="11" fill="#37474f">Impresión 3D</text>

    <rect x="560" y="226" width="180" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="650" y="250" text-anchor="middle" font-size="11" fill="#37474f">Realidad aumentada (mantenimiento)</text>

    <rect x="750" y="226" width="190" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
    <text x="845" y="250" text-anchor="middle" font-size="11" fill="#37474f">Ciberseguridad OT</text>

    <text x="750" y="290" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">Impacto: mantenimiento predictivo,</text>
    <text x="750" y="306" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">calidad y seguridad de la producción</text>
  </g>

  <text x="500" y="345" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Negocio y planta se retroalimentan: sin datos de planta no hay decisiones de negocio informadas</text>

  <defs>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f9a825"/>
    </marker>
    <marker id="arrowb2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f9a825"/>
    </marker>
  </defs>
</svg>
