<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="340" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">THD y economía sostenible y eficiente</text>

  <!-- Circulo THD -->
  <g>
    <circle cx="230" cy="180" r="120" fill="#ede7f6" stroke="#5e35b1" stroke-width="2.5"/>
    <text x="230" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#5e35b1">THD</text>
    <text x="230" y="182" text-anchor="middle" font-size="10" fill="#37474f">IoT, gemelos digitales,</text>
    <text x="230" y="198" text-anchor="middle" font-size="10" fill="#37474f">IA, big data, cobótica,</text>
    <text x="230" y="214" text-anchor="middle" font-size="10" fill="#37474f">impresión 3D...</text>
  </g>

  <!-- Flecha central doble -->
  <path d="M350 155 L450 130" stroke="#00897b" stroke-width="3.5" marker-end="url(#arrowe)"/>
  <path d="M350 205 L450 230" stroke="#00897b" stroke-width="3.5" marker-end="url(#arrowe)"/>

  <!-- Circulo economia sostenible -->
  <g>
    <circle cx="580" cy="180" r="130" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/>
    <text x="580" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#00897b">Economía sostenible</text>
    <text x="580" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#00897b">y eficiente</text>

    <rect x="500" y="172" width="160" height="30" rx="7" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/>
    <text x="580" y="192" text-anchor="middle" font-size="10" fill="#37474f">Ahorro de energía y recursos</text>

    <rect x="500" y="208" width="160" height="30" rx="7" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/>
    <text x="580" y="228" text-anchor="middle" font-size="10" fill="#37474f">Menos residuos (economía circular)</text>

    <rect x="500" y="244" width="160" height="30" rx="7" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/>
    <text x="580" y="264" text-anchor="middle" font-size="10" fill="#37474f">Mantenimiento predictivo</text>
  </g>

  <!-- Nuevos mercados -->
  <g>
    <rect x="770" y="90" width="200" height="180" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
    <text x="870" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#8d6e00">Nuevos mercados</text>
    <text x="870" y="140" text-anchor="middle" font-size="10" fill="#37474f">Servicios de datos</text>
    <text x="870" y="160" text-anchor="middle" font-size="10" fill="#37474f">Economía del reciclaje</text>
    <text x="870" y="180" text-anchor="middle" font-size="10" fill="#37474f">Consultoría THD</text>
    <text x="870" y="200" text-anchor="middle" font-size="10" fill="#37474f">Ciberseguridad OT</text>
    <text x="870" y="220" text-anchor="middle" font-size="10" fill="#37474f">Formación inmersiva (RV/RA)</text>
    <text x="870" y="240" text-anchor="middle" font-size="10" fill="#37474f">Fabricación bajo demanda (3D)</text>
  </g>

  <path d="M710 180 L765 180" stroke="#f9a825" stroke-width="3" marker-end="url(#arroww)"/>

  <text x="500" y="315" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Las THD reducen el consumo de recursos y, a la vez, abren mercados que antes no existían</text>

  <defs>
    <marker id="arrowe" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00897b"/>
    </marker>
    <marker id="arroww" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f9a825"/>
    </marker>
  </defs>
</svg>
