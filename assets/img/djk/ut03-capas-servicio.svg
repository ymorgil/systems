<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="380" rx="18" fill="#f7f6fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Niveles de servicio en la nube: IaaS, PaaS, SaaS y XaaS</text>

  <!-- XaaS (top, widest concept but drawn as top layer) -->
  <g>
    <rect x="120" y="60" width="760" height="60" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="220" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">XaaS</text>
    <text x="560" y="96" text-anchor="middle" font-size="11" fill="#37474f">Todo como servicio: DBaaS, FaaS, BaaS, SECaaS</text>
  </g>

  <!-- SaaS -->
  <g>
    <rect x="160" y="130" width="680" height="60" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="250" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">SaaS</text>
    <text x="560" y="166" text-anchor="middle" font-size="11" fill="#37474f">Aplicaciones vía navegador: Gmail, Microsoft 365, Salesforce</text>
  </g>

  <!-- PaaS -->
  <g>
    <rect x="200" y="200" width="600" height="60" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="280" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">PaaS</text>
    <text x="560" y="236" text-anchor="middle" font-size="11" fill="#37474f">Plataforma de desarrollo: App Engine, Azure App Service, Heroku</text>
  </g>

  <!-- IaaS -->
  <g>
    <rect x="240" y="270" width="520" height="60" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="310" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">IaaS</text>
    <text x="560" y="306" text-anchor="middle" font-size="11" fill="#37474f">Servidores, almacenamiento y redes virtuales: EC2, Azure VM</text>
  </g>

  <text x="500" y="360" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">De abajo a arriba, el proveedor asume más responsabilidad y el cliente pierde control de administración</text>
</svg>
