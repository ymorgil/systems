<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="360" rx="18" fill="#f7f6fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Del dispositivo a la nube: Mist, Edge, Fog y Cloud computing</text>

  <!-- Cloud (far) -->
  <g>
    <rect x="800" y="70" width="170" height="220" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="885" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Cloud</text>
    <text x="885" y="130" text-anchor="middle" font-size="10" fill="#37474f">Centro de datos</text>
    <text x="885" y="150" text-anchor="middle" font-size="10" fill="#37474f">remoto</text>
    <text x="885" y="180" text-anchor="middle" font-size="10" fill="#37474f">Latencia alta</text>
    <text x="885" y="200" text-anchor="middle" font-size="10" fill="#37474f">Máxima capacidad</text>
    <text x="885" y="230" text-anchor="middle" font-size="10" fill="#37474f">de cómputo</text>
  </g>

  <!-- Fog -->
  <g>
    <rect x="590" y="70" width="180" height="220" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="680" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Fog</text>
    <text x="680" y="130" text-anchor="middle" font-size="10" fill="#37474f">Routers, gateways</text>
    <text x="680" y="150" text-anchor="middle" font-size="10" fill="#37474f">y servidores locales</text>
    <text x="680" y="180" text-anchor="middle" font-size="10" fill="#37474f">Latencia media</text>
    <text x="680" y="200" text-anchor="middle" font-size="10" fill="#37474f">Distribuye carga</text>
    <text x="680" y="220" text-anchor="middle" font-size="10" fill="#37474f">entre el borde</text>
    <text x="680" y="240" text-anchor="middle" font-size="10" fill="#37474f">y la nube</text>
  </g>

  <!-- Edge -->
  <g>
    <rect x="380" y="70" width="180" height="220" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="470" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Edge</text>
    <text x="470" y="130" text-anchor="middle" font-size="10" fill="#37474f">Fábrica, vehículo,</text>
    <text x="470" y="150" text-anchor="middle" font-size="10" fill="#37474f">dispositivo IoT</text>
    <text x="470" y="180" text-anchor="middle" font-size="10" fill="#37474f">Latencia baja</text>
    <text x="470" y="200" text-anchor="middle" font-size="10" fill="#37474f">Procesa cerca del</text>
    <text x="470" y="220" text-anchor="middle" font-size="10" fill="#37474f">origen de los datos</text>
  </g>

  <!-- Mist -->
  <g>
    <rect x="170" y="70" width="180" height="220" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="260" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Mist</text>
    <text x="260" y="130" text-anchor="middle" font-size="10" fill="#37474f">El propio sensor</text>
    <text x="260" y="150" text-anchor="middle" font-size="10" fill="#37474f">o microcontrolador</text>
    <text x="260" y="180" text-anchor="middle" font-size="10" fill="#37474f">Latencia mínima</text>
    <text x="260" y="200" text-anchor="middle" font-size="10" fill="#37474f">Control de tráfico,</text>
    <text x="260" y="220" text-anchor="middle" font-size="10" fill="#37474f">diagnóstico médico,</text>
    <text x="260" y="240" text-anchor="middle" font-size="10" fill="#37474f">IoT crítico</text>
  </g>

  <!-- Device -->
  <g>
    <rect x="30" y="140" width="110" height="80" rx="12" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
    <text x="85" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#ad1457">Dispositivo</text>
    <text x="85" y="195" text-anchor="middle" font-size="10" fill="#37474f">final / sensor</text>
  </g>

  <path d="M140 180 L165 180" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>
  <path d="M350 180 L375 180" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>
  <path d="M560 180 L585 180" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>
  <path d="M770 180 L795 180" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>

  <text x="500" y="335" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">A menor distancia al dispositivo, menor latencia; a mayor distancia, mayor capacidad de procesamiento centralizado</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
