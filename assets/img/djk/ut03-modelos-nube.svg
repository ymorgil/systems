<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="340" rx="18" fill="#f7f6fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Modelos de nube: pública, privada, híbrida y multinube</text>

  <!-- Pública -->
  <g>
    <rect x="30" y="70" width="220" height="220" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="140" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#5e35b1">Pública</text>
    <text x="140" y="130" text-anchor="middle" font-size="11" fill="#37474f">Recursos compartidos</text>
    <text x="140" y="150" text-anchor="middle" font-size="11" fill="#37474f">entre varios clientes</text>
    <text x="140" y="180" text-anchor="middle" font-size="11" fill="#37474f">Máxima escalabilidad</text>
    <text x="140" y="200" text-anchor="middle" font-size="11" fill="#37474f">Pago por uso</text>
    <text x="140" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#5e35b1">AWS · Azure · GCP</text>
    <text x="140" y="260" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">Menor control directo</text>
  </g>

  <!-- Privada -->
  <g>
    <rect x="270" y="70" width="220" height="220" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="380" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#00897b">Privada</text>
    <text x="380" y="130" text-anchor="middle" font-size="11" fill="#37474f">Infraestructura dedicada</text>
    <text x="380" y="150" text-anchor="middle" font-size="11" fill="#37474f">a una sola organización</text>
    <text x="380" y="180" text-anchor="middle" font-size="11" fill="#37474f">Mayor control y seguridad</text>
    <text x="380" y="200" text-anchor="middle" font-size="11" fill="#37474f">Cumplimiento normativo</text>
    <text x="380" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#00897b">Centro de datos propio</text>
    <text x="380" y="260" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">Mayor coste de despliegue</text>
  </g>

  <!-- Híbrida -->
  <g>
    <rect x="510" y="70" width="220" height="220" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="620" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#5e35b1">Híbrida</text>
    <text x="620" y="130" text-anchor="middle" font-size="11" fill="#37474f">Combina nube pública</text>
    <text x="620" y="150" text-anchor="middle" font-size="11" fill="#37474f">y privada conectadas</text>
    <text x="620" y="180" text-anchor="middle" font-size="11" fill="#37474f">Flexibilidad + control</text>
    <text x="620" y="200" text-anchor="middle" font-size="11" fill="#37474f">Datos sensibles en local</text>
    <text x="620" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#5e35b1">Cargas variables al público</text>
    <text x="620" y="260" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">Mayor complejidad de gestión</text>
  </g>

  <!-- Multinube -->
  <g>
    <rect x="750" y="70" width="220" height="220" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="860" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#00897b">Multinube</text>
    <text x="860" y="130" text-anchor="middle" font-size="11" fill="#37474f">Varios proveedores</text>
    <text x="860" y="150" text-anchor="middle" font-size="11" fill="#37474f">cloud simultáneos</text>
    <text x="860" y="180" text-anchor="middle" font-size="11" fill="#37474f">Evita dependencia de uno</text>
    <text x="860" y="200" text-anchor="middle" font-size="11" fill="#37474f">Mejor resiliencia</text>
    <text x="860" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#00897b">AWS + Azure + GCP</text>
    <text x="860" y="260" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">Mayor complejidad de integración</text>
  </g>

  <text x="500" y="320" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">La elección depende del equilibrio entre coste, control, escalabilidad y cumplimiento normativo</text>
</svg>
