<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="400" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Ciclo de vida del dato en un proyecto de inteligencia artificial</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#607d8b">De la recopilación de datos al modelo entrenado, con iteración continua</text>

  <!-- Paso 1 -->
  <g>
    <rect x="30" y="100" width="165" height="90" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="112" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">1. Recopilación</text>
    <text x="112" y="146" text-anchor="middle" font-size="10" fill="#37474f">de datos</text>
    <text x="112" y="164" text-anchor="middle" font-size="10" fill="#37474f">Logs, sensores IoT,</text>
    <text x="112" y="178" text-anchor="middle" font-size="10" fill="#37474f">bases de datos</text>
  </g>

  <path d="M195 145 L225 145" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Paso 2 -->
  <g>
    <rect x="225" y="100" width="165" height="90" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="307" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">2. Preprocesamiento</text>
    <text x="307" y="150" text-anchor="middle" font-size="10" fill="#37474f">Limpieza, normalización,</text>
    <text x="307" y="164" text-anchor="middle" font-size="10" fill="#37474f">estructurado vs</text>
    <text x="307" y="178" text-anchor="middle" font-size="10" fill="#37474f">no estructurado</text>
  </g>

  <path d="M390 145 L420 145" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Paso 3 -->
  <g>
    <rect x="420" y="100" width="165" height="90" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="502" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">3. Modelado</text>
    <text x="502" y="146" text-anchor="middle" font-size="10" fill="#37474f">y entrenamiento</text>
    <text x="502" y="164" text-anchor="middle" font-size="10" fill="#37474f">Machine learning /</text>
    <text x="502" y="178" text-anchor="middle" font-size="10" fill="#37474f">deep learning</text>
  </g>

  <path d="M585 145 L615 145" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Paso 4 -->
  <g>
    <rect x="615" y="100" width="165" height="90" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="697" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">4. Evaluación</text>
    <text x="697" y="146" text-anchor="middle" font-size="10" fill="#37474f">y validación</text>
    <text x="697" y="164" text-anchor="middle" font-size="10" fill="#37474f">Precisión, sesgo,</text>
    <text x="697" y="178" text-anchor="middle" font-size="10" fill="#37474f">representatividad</text>
  </g>

  <path d="M780 145 L810 145" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Paso 5 -->
  <g>
    <rect x="810" y="100" width="160" height="90" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="890" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#8d6e00">5. Despliegue</text>
    <text x="890" y="146" text-anchor="middle" font-size="10" fill="#37474f">Modelo en</text>
    <text x="890" y="164" text-anchor="middle" font-size="10" fill="#37474f">producción</text>
    <text x="890" y="178" text-anchor="middle" font-size="10" fill="#37474f">(rentabilidad)</text>
  </g>

  <!-- Flecha de retorno: iteracion continua -->
  <path d="M890 190 C 890 290, 112 290, 112 190" stroke="#5e35b1" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  <text x="500" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Iteración y mejora continua</text>

  <!-- Caja de desafios -->
  <g>
    <rect x="230" y="320" width="540" height="60" rx="12" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
    <text x="500" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#ad1457">Desafíos transversales del tratamiento de datos</text>
    <text x="500" y="360" text-anchor="middle" font-size="10" fill="#37474f">Sesgo y equidad · privacidad (RGPD) · transparencia · seguridad frente a ataques adversariales</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
