<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="400" rx="18" fill="#f7f6fb"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">La IA como tecnología transversal: contribución a otras THD</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#607d8b">La inteligencia artificial en el centro, irradiando valor añadido al resto de tecnologías habilitadoras</text>

  <!-- Nodo central IA -->
  <circle cx="500" cy="210" r="70" fill="#5e35b1" stroke="#37474f" stroke-width="2"/>
  <text x="500" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">IA</text>
  <text x="500" y="223" text-anchor="middle" font-size="10" fill="#ede7f6">núcleo transversal</text>

  <!-- Nodos alrededor -->
  <!-- IoT -->
  <line x1="500" y1="210" x2="220" y2="100" stroke="#90a4ae" stroke-width="1.5"/>
  <rect x="120" y="70" width="180" height="62" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="210" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#00897b">IoT</text>
  <text x="210" y="110" text-anchor="middle" font-size="9.5" fill="#37474f">Análisis en tiempo real</text>
  <text x="210" y="123" text-anchor="middle" font-size="9.5" fill="#37474f">de datos de sensores</text>

  <!-- Big Data -->
  <line x1="500" y1="210" x2="220" y2="210" stroke="#90a4ae" stroke-width="1.5"/>
  <rect x="120" y="180" width="180" height="62" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="210" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#5e35b1">Big Data</text>
  <text x="210" y="220" text-anchor="middle" font-size="9.5" fill="#37474f">Extracción de patrones</text>
  <text x="210" y="233" text-anchor="middle" font-size="9.5" fill="#37474f">en volúmenes masivos</text>

  <!-- Ciberseguridad -->
  <line x1="500" y1="210" x2="220" y2="320" stroke="#90a4ae" stroke-width="1.5"/>
  <rect x="120" y="290" width="180" height="62" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="210" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#00897b">Ciberseguridad</text>
  <text x="210" y="330" text-anchor="middle" font-size="9.5" fill="#37474f">Detección de amenazas</text>
  <text x="210" y="343" text-anchor="middle" font-size="9.5" fill="#37474f">y anomalías (Darktrace)</text>

  <!-- Cloud -->
  <line x1="500" y1="210" x2="780" y2="100" stroke="#90a4ae" stroke-width="1.5"/>
  <rect x="700" y="70" width="180" height="62" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="790" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#5e35b1">Computación en la nube</text>
  <text x="790" y="110" text-anchor="middle" font-size="9.5" fill="#37474f">Asignación inteligente</text>
  <text x="790" y="123" text-anchor="middle" font-size="9.5" fill="#37474f">de recursos (Azure/AWS)</text>

  <!-- Gemelos digitales / robotica -->
  <line x1="500" y1="210" x2="780" y2="210" stroke="#90a4ae" stroke-width="1.5"/>
  <rect x="700" y="180" width="180" height="62" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="790" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#00897b">Gemelos digitales</text>
  <text x="790" y="220" text-anchor="middle" font-size="9.5" fill="#37474f">Simulación predictiva</text>
  <text x="790" y="233" text-anchor="middle" font-size="9.5" fill="#37474f">y robótica colaborativa</text>

  <!-- Redes 5G -->
  <line x1="500" y1="210" x2="780" y2="320" stroke="#90a4ae" stroke-width="1.5"/>
  <rect x="700" y="290" width="180" height="62" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="790" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#5e35b1">Redes 5G</text>
  <text x="790" y="330" text-anchor="middle" font-size="9.5" fill="#37474f">Gestión inteligente</text>
  <text x="790" y="343" text-anchor="middle" font-size="9.5" fill="#37474f">de red (Cisco DNA Center)</text>

  <text x="500" y="385" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">La IA no sustituye a las demás THD: las potencia añadiendo capacidad de análisis y decisión automática</text>
</svg>
