<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="400" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Inteligencia artificial, machine learning y deep learning</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#607d8b">Tres círculos concéntricos: cada disciplina interior es un subconjunto de la exterior</text>

  <!-- Pirámide / círculos concéntricos -->
  <g>
    <!-- IA: círculo exterior -->
    <ellipse cx="330" cy="230" rx="270" ry="140" fill="#ede7f6" stroke="#5e35b1" stroke-width="2.5"/>
    <text x="330" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#5e35b1">Inteligencia artificial (IA)</text>
    <text x="330" y="134" text-anchor="middle" font-size="11" fill="#37474f">Simulación de procesos de inteligencia humana</text>

    <!-- ML: círculo medio -->
    <ellipse cx="330" cy="250" rx="185" ry="95" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/>
    <text x="330" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Machine learning</text>
    <text x="330" y="203" text-anchor="middle" font-size="11" fill="#37474f">Algoritmos que aprenden</text>
    <text x="330" y="217" text-anchor="middle" font-size="11" fill="#37474f">patrones de los datos</text>

    <!-- DL: círculo interior -->
    <ellipse cx="330" cy="280" rx="100" ry="55" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
    <text x="330" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#8d6e00">Deep learning</text>
    <text x="330" y="288" text-anchor="middle" font-size="10" fill="#37474f">Redes neuronales</text>
    <text x="330" y="300" text-anchor="middle" font-size="10" fill="#37474f">de múltiples capas</text>
  </g>

  <!-- Panel derecho: ejemplos por capa -->
  <g>
    <rect x="655" y="80" width="310" height="70" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="670" y="103" font-size="12" font-weight="700" fill="#5e35b1">IA (concepto amplio)</text>
    <text x="670" y="122" font-size="11" fill="#37474f">Sistemas expertos, lógica difusa,</text>
    <text x="670" y="138" font-size="11" fill="#37474f">planificación automática, robótica</text>

    <rect x="655" y="165" width="310" height="70" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="670" y="188" font-size="12" font-weight="700" fill="#00897b">Machine learning</text>
    <text x="670" y="207" font-size="11" fill="#37474f">Supervisado, no supervisado,</text>
    <text x="670" y="223" font-size="11" fill="#37474f">semi-supervisado, por refuerzo</text>

    <rect x="655" y="250" width="310" height="70" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="670" y="273" font-size="12" font-weight="700" fill="#8d6e00">Deep learning</text>
    <text x="670" y="292" font-size="11" fill="#37474f">Visión por computadora, procesamiento</text>
    <text x="670" y="308" font-size="11" fill="#37474f">de lenguaje natural (NLP), voz</text>
  </g>

  <text x="500" y="380" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Todo deep learning es machine learning, y todo machine learning es IA; no al revés</text>
</svg>
