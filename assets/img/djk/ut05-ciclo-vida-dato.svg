<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="360" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#37474f">Ciclo de vida del dato</text>

  <!-- Flecha circular de fondo -->
  <path d="M120 190 A380 130 0 0 1 880 190" stroke="#b39ddb" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/>
  <path d="M880 210 A380 130 0 0 1 120 210" stroke="#80cbc4" stroke-width="3" fill="none" marker-end="url(#arrowTeal)"/>

  <defs>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5e35b1"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00897b"/>
    </marker>
  </defs>

  <!-- 1. Generacion/recopilacion -->
  <rect x="40" y="150" width="150" height="70" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="115" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">1. Generación /</text>
  <text x="115" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">recopilación</text>
  <text x="115" y="210" text-anchor="middle" font-size="9" fill="#37474f">Sensores, formularios, logs</text>

  <!-- 2. Almacenamiento -->
  <rect x="230" y="90" width="150" height="70" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="305" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">2. Almacenamiento</text>
  <text x="305" y="140" text-anchor="middle" font-size="9" fill="#37474f">Bases de datos, data lakes</text>

  <!-- 3. Procesamiento/analisis -->
  <rect x="425" y="60" width="150" height="70" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="500" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">3. Procesamiento /</text>
  <text x="500" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">análisis</text>
  <text x="500" y="120" text-anchor="middle" font-size="9" fill="#37474f">Limpieza, ETL, modelado</text>

  <!-- 4. Uso/explotacion -->
  <rect x="620" y="90" width="150" height="70" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="695" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">4. Uso / explotación</text>
  <text x="695" y="140" text-anchor="middle" font-size="9" fill="#37474f">Decisiones, informes, IA</text>

  <!-- 5. Archivo o eliminacion -->
  <rect x="810" y="150" width="150" height="70" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="885" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">5. Archivo o</text>
  <text x="885" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">eliminación</text>
  <text x="885" y="210" text-anchor="middle" font-size="9" fill="#37474f">Retención legal o borrado seguro</text>

  <!-- Conectores rectos entre cajas -->
  <path d="M190 175 L230 145" stroke="#90a4ae" stroke-width="1.5"/>
  <path d="M380 115 L425 105" stroke="#90a4ae" stroke-width="1.5"/>
  <path d="M575 100 L620 110" stroke="#90a4ae" stroke-width="1.5"/>
  <path d="M770 140 L810 165" stroke="#90a4ae" stroke-width="1.5"/>

  <rect x="330" y="260" width="340" height="60" rx="12" fill="#fff" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="500" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">La protección de datos y la ciberseguridad</text>
  <text x="500" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">se aplican en todas y cada una de las fases</text>

  <text x="500" y="345" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Criterio b) del RA5: el ciclo de vida del dato</text>
</svg>
