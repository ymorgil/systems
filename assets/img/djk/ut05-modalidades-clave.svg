<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="380" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#37474f">Sistema Cl@ve: cuatro modalidades de identificación digital</text>

  <!-- Cl@ve Permanente -->
  <rect x="40" y="65" width="220" height="270" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="150" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Cl@ve Permanente</text>
  <circle cx="65" cy="120" r="3.5" fill="#5e35b1"/>
  <text x="78" y="124" font-size="10" fill="#37474f">Usuario + contraseña</text>
  <circle cx="65" cy="142" r="3.5" fill="#5e35b1"/>
  <text x="78" y="146" font-size="10" fill="#37474f">Validez aprox. 1 año</text>
  <circle cx="65" cy="164" r="3.5" fill="#5e35b1"/>
  <text x="78" y="168" font-size="10" fill="#37474f">SMS extra en trámites</text>
  <text x="90" y="180" font-size="10" fill="#37474f">sensibles</text>
  <circle cx="65" cy="200" r="3.5" fill="#5e35b1"/>
  <text x="78" y="204" font-size="10" fill="#37474f">Uso frecuente</text>
  <rect x="60" y="280" width="180" height="42" rx="8" fill="#5e35b1"/>
  <text x="150" y="298" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">Ideal para uso habitual</text>
  <text x="150" y="312" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">y continuado</text>

  <!-- Cl@ve PIN -->
  <rect x="270" y="65" width="220" height="270" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="380" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">Cl@ve PIN</text>
  <circle cx="295" cy="120" r="3.5" fill="#00897b"/>
  <text x="308" y="124" font-size="10" fill="#37474f">Código de un solo uso</text>
  <circle cx="295" cy="142" r="3.5" fill="#00897b"/>
  <text x="308" y="146" font-size="10" fill="#37474f">Enviado por SMS o app</text>
  <circle cx="295" cy="164" r="3.5" fill="#00897b"/>
  <text x="308" y="168" font-size="10" fill="#37474f">No requiere registro</text>
  <text x="320" y="180" font-size="10" fill="#37474f">previo permanente</text>
  <circle cx="295" cy="200" r="3.5" fill="#00897b"/>
  <text x="308" y="204" font-size="10" fill="#37474f">Uso esporádico</text>
  <rect x="290" y="280" width="180" height="42" rx="8" fill="#00897b"/>
  <text x="380" y="298" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">Ideal para trámites</text>
  <text x="380" y="312" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">puntuales</text>

  <!-- Cl@ve Movil -->
  <rect x="500" y="65" width="220" height="270" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="610" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Cl@ve Móvil</text>
  <circle cx="525" cy="120" r="3.5" fill="#5e35b1"/>
  <text x="538" y="124" font-size="10" fill="#37474f">App oficial "Cl@ve"</text>
  <circle cx="525" cy="142" r="3.5" fill="#5e35b1"/>
  <text x="538" y="146" font-size="10" fill="#37474f">Confirmación por</text>
  <text x="550" y="158" font-size="10" fill="#37474f">notificación o QR</text>
  <circle cx="525" cy="178" r="3.5" fill="#5e35b1"/>
  <text x="538" y="182" font-size="10" fill="#37474f">Integra PIN y Permanente</text>
  <circle cx="525" cy="200" r="3.5" fill="#5e35b1"/>
  <text x="538" y="204" font-size="10" fill="#37474f">Sin lector ni certificado</text>
  <rect x="520" y="280" width="180" height="42" rx="8" fill="#5e35b1"/>
  <text x="610" y="298" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">Ideal desde el</text>
  <text x="610" y="312" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">smartphone</text>

  <!-- Cl@ve Firma -->
  <rect x="730" y="65" width="230" height="270" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="845" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">Cl@ve Firma</text>
  <circle cx="755" cy="120" r="3.5" fill="#00897b"/>
  <text x="768" y="124" font-size="10" fill="#37474f">Firma electrónica en la nube</text>
  <circle cx="755" cy="142" r="3.5" fill="#00897b"/>
  <text x="768" y="146" font-size="10" fill="#37474f">Custodiada por Policía y</text>
  <text x="780" y="158" font-size="10" fill="#37474f">Seguridad Social</text>
  <circle cx="755" cy="178" r="3.5" fill="#00897b"/>
  <text x="768" y="182" font-size="10" fill="#37474f">Sin certificado instalado</text>
  <circle cx="755" cy="200" r="3.5" fill="#00897b"/>
  <text x="768" y="204" font-size="10" fill="#37474f">Solo trámites con la AAPP</text>
  <rect x="750" y="280" width="190" height="42" rx="8" fill="#00897b"/>
  <text x="845" y="298" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">No firma documentos</text>
  <text x="845" y="312" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">propios, solo de la AAPP</text>

  <text x="500" y="360" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Plataforma de identificación digital del Gobierno de España para el acceso a servicios públicos online</text>
</svg>
