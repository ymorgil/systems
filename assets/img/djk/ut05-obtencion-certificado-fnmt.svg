<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="340" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#37474f">Cuatro vías para obtener un certificado digital de la FNMT</text>

  <!-- Via 1: Videoidentificacion -->
  <rect x="40" y="65" width="220" height="230" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <circle cx="150" cy="100" r="22" fill="#5e35b1"/>
  <text x="150" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
  <text x="150" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Videoidentificación</text>
  <text x="150" y="165" text-anchor="middle" font-size="10" fill="#37474f">100% online</text>
  <text x="150" y="182" text-anchor="middle" font-size="10" fill="#37474f">Videollamada de</text>
  <text x="150" y="196" text-anchor="middle" font-size="10" fill="#37474f">verificación</text>
  <text x="150" y="220" text-anchor="middle" font-size="10" fill="#37474f">Rápido</text>
  <rect x="70" y="245" width="160" height="30" rx="8" fill="#5e35b1"/>
  <text x="150" y="265" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Tiene coste económico</text>

  <!-- Via 2: Acreditacion presencial -->
  <rect x="270" y="65" width="220" height="230" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <circle cx="380" cy="100" r="22" fill="#00897b"/>
  <text x="380" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
  <text x="380" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">Acreditación presencial</text>
  <text x="380" y="165" text-anchor="middle" font-size="10" fill="#37474f">Solicitud online del</text>
  <text x="380" y="179" text-anchor="middle" font-size="10" fill="#37474f">código de solicitud</text>
  <text x="380" y="200" text-anchor="middle" font-size="10" fill="#37474f">Visita a una oficina</text>
  <text x="380" y="214" text-anchor="middle" font-size="10" fill="#37474f">de registro</text>
  <rect x="300" y="245" width="160" height="30" rx="8" fill="#00897b"/>
  <text x="380" y="265" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Gratuito</text>

  <!-- Via 3: DNIe -->
  <rect x="500" y="65" width="220" height="230" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <circle cx="610" cy="100" r="22" fill="#5e35b1"/>
  <text x="610" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
  <text x="610" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">Mediante DNIe</text>
  <text x="610" y="165" text-anchor="middle" font-size="10" fill="#37474f">100% online</text>
  <text x="610" y="182" text-anchor="middle" font-size="10" fill="#37474f">Requiere DNIe y su</text>
  <text x="610" y="196" text-anchor="middle" font-size="10" fill="#37474f">PIN de acceso</text>
  <text x="610" y="217" text-anchor="middle" font-size="10" fill="#37474f">Lector de tarjetas</text>
  <rect x="530" y="245" width="160" height="30" rx="8" fill="#5e35b1"/>
  <text x="610" y="265" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Gratuito</text>

  <!-- Via 4: App movil -->
  <rect x="730" y="65" width="230" height="230" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <circle cx="845" cy="100" r="22" fill="#00897b"/>
  <text x="845" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
  <text x="845" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">Dispositivo móvil</text>
  <text x="845" y="165" text-anchor="middle" font-size="10" fill="#37474f">App "Certificado</text>
  <text x="845" y="179" text-anchor="middle" font-size="10" fill="#37474f">Digital FNMT"</text>
  <text x="845" y="200" text-anchor="middle" font-size="10" fill="#37474f">Lectura del DNIe</text>
  <text x="845" y="214" text-anchor="middle" font-size="10" fill="#37474f">por NFC</text>
  <rect x="765" y="245" width="160" height="30" rx="8" fill="#00897b"/>
  <text x="845" y="265" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Gratuito</text>

  <text x="500" y="320" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">FNMT: Fábrica Nacional de Moneda y Timbre, Autoridad de Certificación de referencia en España</text>
</svg>
