<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="340" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Ciclo de documentación y gestión del cambio</text>

  <!-- circulo de 4 fases -->
  <g>
    <circle cx="500" cy="175" r="120" fill="none" stroke="#b0bec5" stroke-width="2" stroke-dasharray="2,6"/>
  </g>

  <!-- Nodo 1: decidir -->
  <g>
    <rect x="420" y="35" width="160" height="70" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="500" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">1. Decidir</text>
    <text x="500" y="78" text-anchor="middle" font-size="10" fill="#37474f">Elegir tecnología</text>
    <text x="500" y="93" text-anchor="middle" font-size="10" fill="#37474f">o herramienta</text>
  </g>

  <!-- Nodo 2: comunicar -->
  <g>
    <rect x="650" y="145" width="160" height="70" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="730" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">2. Formar</text>
    <text x="730" y="188" text-anchor="middle" font-size="10" fill="#37474f">Capacitar al</text>
    <text x="730" y="203" text-anchor="middle" font-size="10" fill="#37474f">personal implicado</text>
  </g>

  <!-- Nodo 3: documentar -->
  <g>
    <rect x="420" y="255" width="160" height="70" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="500" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">3. Documentar</text>
    <text x="500" y="298" text-anchor="middle" font-size="10" fill="#37474f">Registrar cambio,</text>
    <text x="500" y="313" text-anchor="middle" font-size="10" fill="#37474f">brechas y encaje</text>
  </g>

  <!-- Nodo 4: revisar -->
  <g>
    <rect x="190" y="145" width="160" height="70" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="270" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">4. Revisar</text>
    <text x="270" y="188" text-anchor="middle" font-size="10" fill="#37474f">Gestionar la</text>
    <text x="270" y="203" text-anchor="middle" font-size="10" fill="#37474f">resistencia al cambio</text>
  </g>

  <!-- Flechas circulares -->
  <path d="M580 75 Q650 100 690 150" stroke="#90a4ae" stroke-width="3" fill="none" marker-end="url(#arrowc)"/>
  <path d="M700 210 Q640 260 585 280" stroke="#90a4ae" stroke-width="3" fill="none" marker-end="url(#arrowc)"/>
  <path d="M420 290 Q350 260 310 215" stroke="#90a4ae" stroke-width="3" fill="none" marker-end="url(#arrowc)"/>
  <path d="M300 150 Q360 100 420 75" stroke="#90a4ae" stroke-width="3" fill="none" marker-end="url(#arrowc)"/>

  <!-- Centro -->
  <circle cx="500" cy="175" r="42" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="500" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#ef6c00">Recursos</text>
  <text x="500" y="184" text-anchor="middle" font-size="10" font-weight="700" fill="#ef6c00">Humanos</text>

  <text x="500" y="325" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Criterios j) y k): documentar cada decisión y cuidar a las personas son procesos continuos, no un trámite final</text>

  <defs>
    <marker id="arrowc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
