<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="380" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Fases del proyecto de transformación digital</text>

  <!-- Fase 1 -->
  <g>
    <rect x="20" y="70" width="150" height="140" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="95" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">1. Diagnóstico</text>
    <text x="95" y="122" text-anchor="middle" font-size="10" fill="#37474f">Sector y modelo</text>
    <text x="95" y="137" text-anchor="middle" font-size="10" fill="#37474f">de negocio actual</text>
    <text x="95" y="157" text-anchor="middle" font-size="10" fill="#37474f">Objetivos</text>
    <text x="95" y="172" text-anchor="middle" font-size="10" fill="#37474f">estratégicos</text>
    <text x="95" y="192" text-anchor="middle" font-size="10" fill="#37474f">Áreas de mejora</text>
  </g>

  <path d="M170 140 L210 140" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrowf1)"/>

  <!-- Fase 2 -->
  <g>
    <rect x="215" y="70" width="150" height="140" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="290" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">2. Áreas y THD</text>
    <text x="290" y="122" text-anchor="middle" font-size="10" fill="#37474f">Áreas digitalizables</text>
    <text x="290" y="142" text-anchor="middle" font-size="10" fill="#37474f">Tecnologías</text>
    <text x="290" y="157" text-anchor="middle" font-size="10" fill="#37474f">habilitadoras</text>
    <text x="290" y="177" text-anchor="middle" font-size="10" fill="#37474f">Encaje AD / no AD</text>
  </g>

  <path d="M365 140 L405 140" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrowf1)"/>

  <!-- Fase 3 -->
  <g>
    <rect x="410" y="70" width="150" height="140" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="485" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">3. Seguridad</text>
    <text x="485" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1" opacity="0"> </text>
    <text x="485" y="122" text-anchor="middle" font-size="10" fill="#37474f">y datos</text>
    <text x="485" y="142" text-anchor="middle" font-size="10" fill="#37474f">Brechas por área</text>
    <text x="485" y="157" text-anchor="middle" font-size="10" fill="#37474f">Tratamiento y</text>
    <text x="485" y="172" text-anchor="middle" font-size="10" fill="#37474f">análisis de datos</text>
    <text x="485" y="192" text-anchor="middle" font-size="10" fill="#37474f">Cumplimiento RGPD</text>
  </g>

  <path d="M560 140 L600 140" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrowf1)"/>

  <!-- Fase 4 -->
  <g>
    <rect x="605" y="70" width="150" height="140" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="680" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">4. Integración</text>
    <text x="680" y="122" text-anchor="middle" font-size="10" fill="#37474f">ERP / CRM / BPM</text>
    <text x="680" y="142" text-anchor="middle" font-size="10" fill="#37474f">Plataformas y</text>
    <text x="680" y="157" text-anchor="middle" font-size="10" fill="#37474f">flujos de datos</text>
    <text x="680" y="177" text-anchor="middle" font-size="10" fill="#37474f">Prototipo / mockup</text>
  </g>

  <path d="M755 140 L795 140" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrowf1)"/>

  <!-- Fase 5 -->
  <g>
    <rect x="800" y="70" width="180" height="140" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="890" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">5. Personas y</text>
    <text x="890" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">documentación</text>
    <text x="890" y="142" text-anchor="middle" font-size="10" fill="#37474f">Gestión del cambio</text>
    <text x="890" y="157" text-anchor="middle" font-size="10" fill="#37474f">Formación de RRHH</text>
    <text x="890" y="177" text-anchor="middle" font-size="10" fill="#37474f">Documentar y presentar</text>
  </g>

  <text x="500" y="250" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Cada fase alimenta la siguiente: diagnosticar antes de digitalizar, asegurar antes de integrar, documentar en todo momento</text>

  <!-- barra de progreso inferior -->
  <rect x="60" y="290" width="880" height="14" rx="7" fill="#e0e0e0"/>
  <rect x="60" y="290" width="880" height="14" rx="7" fill="none" stroke="#90a4ae" stroke-width="1"/>
  <rect x="60" y="290" width="176" height="14" rx="7" fill="#5e35b1"/>
  <rect x="236" y="290" width="176" height="14" fill="#7e57c2"/>
  <rect x="412" y="290" width="176" height="14" fill="#00897b"/>
  <rect x="588" y="290" width="176" height="14" fill="#26a69a"/>
  <rect x="764" y="290" width="176" height="14" rx="7" fill="#8e63ce"/>

  <text x="500" y="335" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">UT06 · Metodología del proyecto de transformación digital, aplicable a cualquier sector</text>

  <defs>
    <marker id="arrowf1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
