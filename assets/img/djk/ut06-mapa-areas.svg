<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="360" rx="18" fill="#f7f6fb"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Mapa de áreas digitalizadas (AD) frente a áreas no digitalizadas</text>

  <!-- Columna AD -->
  <rect x="40" y="65" width="430" height="235" rx="16" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="255" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#5e35b1">Áreas digitalizadas (AD)</text>

  <rect x="60" y="105" width="180" height="46" rx="10" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="150" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Gestión de pedidos</text>
  <text x="150" y="139" text-anchor="middle" font-size="9" fill="#607d8b">e-commerce / ERP</text>

  <rect x="250" y="105" width="200" height="46" rx="10" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="350" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Atención al cliente</text>
  <text x="350" y="139" text-anchor="middle" font-size="9" fill="#607d8b">CRM / chatbot</text>

  <rect x="60" y="160" width="180" height="46" rx="10" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="150" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Control de stock</text>
  <text x="150" y="194" text-anchor="middle" font-size="9" fill="#607d8b">IoT / sensores</text>

  <rect x="250" y="160" width="200" height="46" rx="10" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="350" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Analítica de datos</text>
  <text x="350" y="194" text-anchor="middle" font-size="9" fill="#607d8b">BI / cuadros de mando</text>

  <rect x="60" y="215" width="390" height="46" rx="10" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="255" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Gestión de citas / reservas online</text>
  <text x="255" y="249" text-anchor="middle" font-size="9" fill="#607d8b">app o web con agenda integrada</text>

  <!-- Encaje central -->
  <g>
    <ellipse cx="500" cy="182" rx="45" ry="45" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="500" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#ef6c00">Encaje</text>
    <text x="500" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#ef6c00">AD ↔ no AD</text>
  </g>
  <path d="M470 165 L440 150" stroke="#ef6c00" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M470 200 L440 215" stroke="#ef6c00" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M530 165 L560 150" stroke="#ef6c00" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M530 200 L560 215" stroke="#ef6c00" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Columna no AD -->
  <rect x="530" y="65" width="430" height="235" rx="16" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="745" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#00897b">Áreas todavía no digitalizadas</text>

  <rect x="550" y="105" width="180" height="46" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
  <text x="640" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Trato presencial</text>
  <text x="640" y="139" text-anchor="middle" font-size="9" fill="#607d8b">recepción, taller</text>

  <rect x="740" y="105" width="200" height="46" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
  <text x="840" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Procesos en papel</text>
  <text x="840" y="139" text-anchor="middle" font-size="9" fill="#607d8b">albaranes, fichas</text>

  <rect x="550" y="160" width="180" height="46" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
  <text x="640" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Mantenimiento</text>
  <text x="640" y="194" text-anchor="middle" font-size="9" fill="#607d8b">correctivo manual</text>

  <rect x="740" y="160" width="200" height="46" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
  <text x="840" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Formación interna</text>
  <text x="840" y="194" text-anchor="middle" font-size="9" fill="#607d8b">sin plataforma e-learning</text>

  <rect x="550" y="215" width="390" height="46" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
  <text x="745" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f">Decisiones directivas informales</text>
  <text x="745" y="249" text-anchor="middle" font-size="9" fill="#607d8b">sin apoyo en cuadros de mando</text>

  <text x="500" y="330" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Criterios c) y d): identificar qué se digitaliza y analizar cómo encaja con lo que permanece manual</text>

</svg>
