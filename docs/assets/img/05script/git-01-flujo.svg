<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Flujo de trabajo de Git: de tu editor al repositorio remoto</text>

  <!-- Working directory -->
  <g>
    <rect x="30" y="90" width="190" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="125" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Working directory</text>
    <text x="125" y="155" text-anchor="middle" font-size="11" fill="#37474f">Archivos editados</text>
    <text x="125" y="175" text-anchor="middle" font-size="11" fill="#37474f">en VS Code</text>
    <text x="125" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">git add</text>
  </g>

  <path d="M220 165 L265 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrowgit)"/>

  <!-- Staging area -->
  <g>
    <rect x="270" y="90" width="190" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="365" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Staging area</text>
    <text x="365" y="155" text-anchor="middle" font-size="11" fill="#37474f">Índice (index)</text>
    <text x="365" y="175" text-anchor="middle" font-size="11" fill="#37474f">Cambios preparados</text>
    <text x="365" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">git commit</text>
  </g>

  <path d="M460 165 L505 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrowgit)"/>

  <!-- Local repo -->
  <g>
    <rect x="510" y="90" width="190" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="605" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Repositorio local</text>
    <text x="605" y="155" text-anchor="middle" font-size="11" fill="#37474f">Historial de commits</text>
    <text x="605" y="175" text-anchor="middle" font-size="11" fill="#37474f">carpeta .git</text>
    <text x="605" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#00897b">git push</text>
  </g>

  <path d="M700 155 L745 155" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrowgit)"/>
  <path d="M745 185 L700 185" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrowgit)"/>
  <text x="722" y="145" text-anchor="middle" font-size="10" fill="#607d8b">push</text>
  <text x="722" y="200" text-anchor="middle" font-size="10" fill="#607d8b">pull</text>

  <!-- Remote repo -->
  <g>
    <rect x="750" y="90" width="220" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="860" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">Repositorio remoto</text>
    <text x="860" y="155" text-anchor="middle" font-size="11" fill="#37474f">GitHub / GitLab</text>
    <text x="860" y="175" text-anchor="middle" font-size="11" fill="#37474f">origin</text>
    <text x="860" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#5e35b1">git clone</text>
  </g>

  <text x="500" y="290" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">git add → git commit → git push · git pull trae los cambios de vuelta</text>

  <defs>
    <marker id="arrowgit" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
