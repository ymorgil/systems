<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="340" rx="18" fill="#f7f6fb"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Estructura de un rol de Ansible</text>

  <g>
    <rect x="60" y="70" width="220" height="230" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="170" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">roles/nginx/</text>
    <text x="90" y="130" font-size="11" fill="#37474f">tasks/main.yml</text>
    <text x="90" y="152" font-size="11" fill="#37474f">handlers/main.yml</text>
    <text x="90" y="174" font-size="11" fill="#37474f">templates/nginx.conf.j2</text>
    <text x="90" y="196" font-size="11" fill="#37474f">files/index.html</text>
    <text x="90" y="218" font-size="11" fill="#37474f">vars/main.yml</text>
    <text x="90" y="240" font-size="11" fill="#37474f">defaults/main.yml</text>
    <text x="90" y="262" font-size="11" fill="#37474f">meta/main.yml</text>
  </g>

  <path d="M280 185 L330 185" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="335" y="70" width="230" height="230" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="450" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">tasks/main.yml</text>
    <text x="365" y="130" font-size="11" fill="#37474f">- name: Instalar Nginx</text>
    <text x="365" y="148" font-size="11" fill="#37474f">  ansible.builtin.apt</text>
    <text x="365" y="172" font-size="11" fill="#37474f">- name: Copiar plantilla</text>
    <text x="365" y="190" font-size="11" fill="#37474f">  ansible.builtin.template</text>
    <text x="365" y="208" font-size="11" fill="#37474f">  notify: Reiniciar nginx</text>
    <text x="365" y="232" font-size="11" fill="#37474f">- name: Habilitar servicio</text>
    <text x="365" y="250" font-size="11" fill="#37474f">  ansible.builtin.service</text>
  </g>

  <path d="M565 150 L610 150" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="588" y="135" text-anchor="middle" font-size="10" fill="#607d8b">notify</text>

  <g>
    <rect x="615" y="70" width="200" height="100" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="715" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">handlers/main.yml</text>
    <text x="640" y="128" font-size="11" fill="#37474f">- name: Reiniciar nginx</text>
    <text x="640" y="146" font-size="11" fill="#37474f">  ansible.builtin.service</text>
    <text x="640" y="164" font-size="11" fill="#37474f">  state: restarted</text>
  </g>

  <path d="M565 208 L610 208" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="588" y="196" text-anchor="middle" font-size="10" fill="#607d8b">renderiza</text>

  <g>
    <rect x="615" y="190" width="200" height="110" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="715" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#00897b">templates/*.j2</text>
    <text x="640" y="245" font-size="11" fill="#37474f">server ( bloque )</text>
    <text x="640" y="263" font-size="11" fill="#37474f">listen: variable puerto</text>
    <text x="640" y="281" font-size="11" fill="#37474f">Sintaxis Jinja2</text>
  </g>

  <text x="500" y="325" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Los roles agrupan tasks, handlers y plantillas Jinja2 en una estructura reutilizable</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
