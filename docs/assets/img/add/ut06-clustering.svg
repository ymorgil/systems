<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="18" fill="#f7f6fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Clúster de conmutación por error con almacenamiento compartido (quórum)</text>

  <!-- Nodo 1 -->
  <g>
    <rect x="60" y="80" width="180" height="110" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="150" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Nodo 1</text>
    <text x="150" y="132" text-anchor="middle" font-size="11" fill="#37474f">Rol de clúster activo</text>
    <text x="150" y="150" text-anchor="middle" font-size="11" fill="#37474f">1 voto de quórum</text>
    <text x="150" y="168" text-anchor="middle" font-size="11" fill="#37474f">192.168.1.102</text>
  </g>

  <!-- Nodo 2 -->
  <g>
    <rect x="60" y="210" width="180" height="90" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="150" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Nodo 2</text>
    <text x="150" y="258" text-anchor="middle" font-size="11" fill="#37474f">En espera (pasivo)</text>
    <text x="150" y="276" text-anchor="middle" font-size="11" fill="#37474f">192.168.1.103</text>
  </g>

  <path d="M240 135 L305 165" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>
  <path d="M240 255 L305 190" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- Red de interconexión / iSCSI -->
  <g>
    <rect x="310" y="130" width="160" height="90" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="390" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#ef6c00">Red iSCSI</text>
    <text x="390" y="178" text-anchor="middle" font-size="10" fill="#37474f">Discos compartidos</text>
    <text x="390" y="195" text-anchor="middle" font-size="10" fill="#37474f">Testigo de quórum (1GB)</text>
    <text x="390" y="210" text-anchor="middle" font-size="10" fill="#37474f">Volumen de datos (20GB)</text>
  </g>

  <path d="M470 175 L525 175" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- Almacenamiento compartido -->
  <g>
    <rect x="530" y="110" width="150" height="170" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="605" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">Almacenamiento</text>
    <text x="605" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#00897b">compartido</text>
    <ellipse cx="605" cy="190" rx="45" ry="14" fill="#00897b"/>
    <rect x="560" y="190" width="90" height="40" fill="#00897b"/>
    <ellipse cx="605" cy="230" rx="45" ry="14" fill="#00897b"/>
    <text x="605" y="196" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">SAN / NAS</text>
    <text x="605" y="255" text-anchor="middle" font-size="10" fill="#37474f">RAID + ZFS</text>
  </g>

  <path d="M680 195 L735 195" stroke="#90a4ae" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- TrueNAS -->
  <g>
    <rect x="740" y="130" width="200" height="150" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="840" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">TrueNAS CORE</text>
    <text x="840" y="182" text-anchor="middle" font-size="11" fill="#37474f">Sistema de ficheros ZFS</text>
    <text x="840" y="200" text-anchor="middle" font-size="11" fill="#37474f">Comparte vía Samba/NFS</text>
    <text x="840" y="218" text-anchor="middle" font-size="11" fill="#37474f">Unidad T: en el dominio</text>
    <text x="840" y="236" text-anchor="middle" font-size="11" fill="#37474f">Espacio de nombres DFS</text>
    <text x="840" y="254" text-anchor="middle" font-size="10" fill="#607d8b" font-style="italic">Miembro del dominio AD</text>
  </g>

  <text x="500" y="305" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Si Nodo1 falla, Nodo2 asume el servicio (failover) sin perder acceso al almacenamiento compartido</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/>
    </marker>
  </defs>
</svg>
