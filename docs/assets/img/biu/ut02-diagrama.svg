<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="380" rx="18" fill="#f7f6fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">Ecosistema Hadoop: capas y herramientas</text>

  <!-- Capa consulta -->
  <rect x="60" y="60" width="880" height="60" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="100" y="95" font-size="13" font-weight="700" fill="#5e35b1">Consulta y scripting</text>
  <text x="330" y="95" font-size="13" fill="#37474f">Hive (SQL sobre Hadoop)</text>
  <text x="560" y="95" font-size="13" fill="#37474f">Pig (Pig Latin)</text>
  <text x="740" y="95" font-size="13" fill="#90a4ae" text-decoration="line-through">Pig ⚠ uso residual</text>

  <!-- Capa procesamiento -->
  <rect x="60" y="135" width="880" height="60" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="100" y="170" font-size="13" font-weight="700" fill="#00897b">Procesamiento distribuido</text>
  <text x="380" y="170" font-size="13" fill="#37474f">MapReduce (clásico)</text>
  <text x="620" y="170" font-size="13" fill="#37474f" font-weight="700">Apache Spark (recomendado hoy)</text>

  <!-- Capa gestion de recursos -->
  <rect x="60" y="210" width="880" height="55" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="100" y="243" font-size="13" font-weight="700" fill="#5e35b1">Gestión de recursos</text>
  <text x="380" y="243" font-size="13" fill="#37474f">YARN (ResourceManager / NodeManager)</text>

  <!-- Capa almacenamiento -->
  <rect x="60" y="280" width="880" height="55" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="100" y="313" font-size="13" font-weight="700" fill="#00897b">Almacenamiento distribuido</text>
  <text x="380" y="313" font-size="13" fill="#37474f">HDFS: NameNode + DataNodes (réplicas x3)</text>

  <!-- Ingesta lateral -->
  <rect x="0" y="0" width="0" height="0"/>
  <g>
    <rect x="770" y="60" width="0" height="0"/>
  </g>

  <text x="500" y="362" text-anchor="middle" font-size="12" fill="#607d8b" font-style="italic">Ingesta: Sqoop (BBDD relacionales) · Flume (streams/logs) · Automatización: Oozie ⚠ obsoleto → hoy Apache Airflow</text>
</svg>
