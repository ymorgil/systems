site_name: Repositorio de Yeray Moreno
site_url: https://ymorgil.github.io/systems/

theme:
   name: material
   language: es
   logo: assets/favicon.svg
   palette:
      - scheme: default
        primary: deep purple
        accent: indigo
        toggle:
           icon: material/toggle-switch-off-outline
           name: Modo oscuro
      - scheme: slate
        primary: teal
        accent: green
        toggle:
           icon: material/toggle-switch
           name: Modo claro
nav:
   - Inicio: index.md
   - Curso 26/27:
        - Pautas: 01curso/01Pautas.md
        - Veyon: 01curso/02Veyon.md
   - Virtualización:
        - Introducción: 02virtual/01introducción.md
        - VirtualBox: 02virtual/02virtualbox.md
        - VMware: 02virtual/03vmware.md
        - Proxmox: 02virtual/04proxmox.md
   - Cloud:
        - Introducción: 03cloud/01introcloud.md
        - AWS: 03cloud/02aws.md
        - EC2: 03cloud/ec2.md
   - Contenedores:
        - Introducción: 04contenedores/00contenedores.md
        - Docker en Windows: 04contenedores/01docker-windows.md # aquí explicas WSL dentro
        - Docker en Linux: 04contenedores/02docker-linux.md
        - Docker Compose: 04contenedores/03docker-compose.md
        - Kubernetes: 04contenedores/04kubernetes.md
   - Scripting:
        - Introducción: 05scripting/01introducción.md
        - Bash: 05scripting/02bash.md
        - Python: 05scripting/03python.md
   - ADD:
        - Recursos generales: add/00-recursos.md
        - UT01 Servicio de directorio: add/01-servicio-directorio.md
        - UT02 Procesos del sistema: add/02-procesos-sistema.md
        - UT03 Automatización de tareas: add/03-automatizacion-tareas.md
        - UT04 Administración remota: add/04-administracion-remota.md
        - UT05 Servidores de impresión: add/05-servidores-impresion.md
        - UT06 Integración de sistemas: add/06-integracion-sistemas.md
        - UT07 Scripting: add/07-scripting.md
   - BIU:
        - Introducción: biu/00-introduccion.md
        - UT01 Almacenamiento y Cloud: biu/ut01-temario.md
        - UT01 Práctica: biu/ut01-practica.md
        - UT01 Rúbrica: biu/ut01-rubrica.md
        - UT02 Ecosistema Big Data: biu/ut02-temario.md
        - UT02 Práctica: biu/ut02-practica.md
        - UT02 Rúbrica: biu/ut02-rubrica.md
        - UT03 Integridad de los datos: biu/ut03-temario.md
        - UT03 Práctica: biu/ut03-practica.md
        - UT03 Rúbrica: biu/ut03-rubrica.md
        - UT04 Monitorización: biu/ut04-temario.md
        - UT04 Práctica: biu/ut04-practica.md
        - UT04 Rúbrica: biu/ut04-rubrica.md
        - UT05 Big Data e Inteligencia de Negocio: biu/ut05-temario.md
        - UT05 Práctica: biu/ut05-practica.md
        - UT05 Rúbrica: biu/ut05-rubrica.md
        - Recursos: biu/99-recursos.md

plugins:
   - glightbox

extra_css:
   - assets/css/extra.css

markdown_extensions:
   - attr_list
   - pymdownx.highlight:
        anchor_linenums: false
        use_pygments: true
   - pymdownx.superfences
   - pymdownx.inlinehilite
